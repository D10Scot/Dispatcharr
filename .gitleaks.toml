title = "Mino gitleaks config"

# Keep every default rule; only add allowlist entries below for confirmed
# false positives, each with a reason. Don't broaden this to silence real
# findings — the whole point of the CI gate is that it's supposed to fail.
[extend]
useDefault = true

[[allowlists]]
description = "Vendored, minified drf-yasg ReDoc bundle: short minified identifiers trip generic-api-key at low entropy. Not a credential — see the commit link for the source."
# Scoped to the one rule that actually fires here (targetRules), not a
# blanket path exemption — a real secret landing in this same file would
# still be caught by every other rule.
targetRules = ["generic-api-key"]
paths = [
  '''^staticfiles/drf-yasg/redoc/redoc\.min\.js$''',
]

[[allowlists]]
description = "Phase 2c-1 HMAC parity vectors: HMAC-SHA256 outputs computed by apps/proxy/internal_auth.py under the fixed, public test key SECRET_KEY=\"phase2c1-test-secret\" (settings.configure(), no database), so the Go relay's control package can be pinned against Python byte-for-byte rather than against itself. Test literals, not credentials; valid for no deployment. They appear in docs/superpowers/plans/2026-09-13-phase2-2c1-skeleton.md and in relay/control/token_test.go. Scoped to the exact values (regexTarget = secret) and the one rule that fires, so a real secret in either file is still caught by every rule including this one. The optional v1.<unix_ts>. prefix is part of the X-Dispatcharr-Internal-Request header's own wire format, so the same digest appears both bare and prefixed. Regenerating the vectors means updating this block in the same commit: they are allowlisted individually, never by path."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^(v1\.[0-9]+\.)?2bb01b0c4f053b1787d3356fb836282b162002848523b130103c33f9cf7d901c$''',
  '''^(v1\.[0-9]+\.)?19d4b08667108eb1a38fa11d1bbe7646cb90bc017aad605b302add137818ae7a$''',
  '''^(v1\.[0-9]+\.)?5ce39464af1f52fac92ab6dd8101b289c2b9acce93d392216ac0dbcfa53a1fae$''',
  '''^(v1\.[0-9]+\.)?16c32b6499ba30786464bfb130d785fbc3a8b817c7cc5a0e0d73316a60fd702c$''',
  '''^(v1\.[0-9]+\.)?6d24abde774fa01f0c94981f04c77f0b714398dffc379a09c580ac5e00c816d1$''',
]

[[allowlists]]
description = "Observability spec redaction sentinel: S3NT1NEL-pw-9d2f is a made-up value the spec's leak tests plant in a URL password, an exception message and an operator resource attribute, then assert never reaches a span, metric, structured log field or /metrics (docs/superpowers/specs/2026-10-31-observability-design.md, D9 and D13). It is a test literal and valid for nothing. It is allowlisted by exact value (regexTarget = secret) and only for the one rule that fires, never by path, so the implementation PRs' test files may carry it while a real secret in any of those files is still caught by every rule."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^S3NT1NEL-pw-9d2f$''',
]

[[allowlists]]
description = "OIDC SSO test sentinels: SENTINEL-ROTATED-31d7 and SENTINEL-ROTATED-9c1d are made-up client secrets the SSO S1 tests (apps/accounts/tests/test_oidc_audit.py, test_oidc_providers.py) send to the provider admin API and then assert never appear in a response, an audit payload or a log line (docs/superpowers/specs/2026-10-31-sso-oidc-design.md, S1). They are test literals and valid for nothing. They are allowlisted by exact value (regexTarget = secret) and only for the one rule that fires, never by path, so a real secret in either file is still caught by every rule. The entry lives on main because CI's gitleaks scans every ref with full history, so a branch carrying the literals fails the check for every run whose own config lacks it."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^SENTINEL-ROTATED-31d7$''',
  '''^SENTINEL-ROTATED-9c1d$''',
]

[[allowlists]]
description = "Request-log redaction test sentinels: xcpass-sentinel-q7 and xcpass2-sentinel-q7 are made-up Xtream passwords the request-log redaction guard (e2e/tests/guards/request-log-redaction.cases.json) puts in a query string and then asserts are masked in the nginx and uWSGI request logs. They are test literals and valid for nothing. They are allowlisted by exact value (regexTarget = secret) and only for the one rule that fires, never by path, so a real secret in that file is still caught by every rule. The entry lives on main because CI's gitleaks scans every ref with full history, so a branch carrying the literals fails the check for every run whose own config lacks it."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^xcpass-sentinel-q7$''',
  '''^xcpass2-sentinel-q7$''',
]
