title = "Dispatcharr gitleaks config"

# Keep every default rule; only add allowlist entries below for confirmed
# false positives, each with a reason. Don't broaden this to silence real
# findings — the whole point of the CI gate is that it's supposed to fail.
[extend]
useDefault = true

[[allowlists]]
description = "Vendored, minified drf-yasg ReDoc bundle: short minified identifiers trip generic-api-key at low entropy. Not a credential — see the commit link for the source."
# Scoped to the one rule that actually fires here (targetRules), not a
# blanket path exemption — a real secret landing in this same file would
# still be caught by every other rule.
targetRules = ["generic-api-key"]
paths = [
  '''^staticfiles/drf-yasg/redoc/redoc\.min\.js$''',
]
