[project]
name = "dispatcharr"
description = "Dispatcharr - Stream dispatching and management"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "Django==6.0.8", # PYSEC-2026-3717 / CVE-2026-15830, CVSS 6.9, fixed in 6.0.8
    "psycopg[binary]",
    "celery[redis]==5.6.3",
    "djangorestframework==3.17.1",
    "requests==2.34.2",
    "psutil==7.2.2",
    "pillow",
    "drf-spectacular>=0.30.0",
    "streamlink",
    "python-vlc",
    "yt-dlp",
    "gevent==26.7.0",
    "django-db-geventpool",
    "daphne",
    "uwsgi",
    "django-cors-headers",
    "djangorestframework-simplejwt",
    "m3u8",
    "rapidfuzz==3.14.5",
    "regex",
    "tzlocal",
    "pytz",
    "torch==2.13.0+cpu",
    "sentence-transformers==5.6.1",
    "channels",
    "channels-redis==4.3.0",
    "django-filter",
    "django-redis",
    "django-celery-beat>=2.9.0",
    "lxml==6.1.1",
    "packaging",
    # Test-only (property-based testing). Lives in the main dependency list because
    # the repo has no dev/test dependency group yet and CI installs with --no-dev;
    # splitting out a [dependency-groups] dev group is a deliberate future refactor.
    "hypothesis>=6.165.10",
    "coverage>=7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch CPU-only wheels index
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"
name = "pytorch-cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["dispatcharr", "apps", "core"]

[tool.hatch.version]
path = "version.py"
