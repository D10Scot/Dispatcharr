[supervisord]
nodaemon=true
logfile=/run/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/run/supervisord.pid
childlogdir=/run

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# relay-uwsgi.conf (Phase 1 PR 4) is the only program this glob picks up
# (D14: the relay role runs no nginx), and needed no edit here to start
# being included.
[include]
files = /app/docker/supervisord.d/relay-*.conf
