[supervisord]
nodaemon=true
logfile=/run/supervisord.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/run/supervisord.pid
childlogdir=/run

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# This glob picks up every relay-*.conf under supervisord.d: relay-uwsgi.conf
# (Phase 1 PR 4) and, since Phase 2 stage 2c-1, relay-go.conf too (D14: the
# relay role runs no nginx). Neither file needed an edit here to be included
# -- a glob whose comment names only one member is how a second one arrives
# unnoticed, which is what happened here.
[include]
files = /app/docker/supervisord.d/relay-*.conf
