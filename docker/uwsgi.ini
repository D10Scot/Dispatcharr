[uwsgi]
; Redis, Celery and Daphne are supervisord programs now
; (docker/supervisord/all.conf), not managed via uwsgi's daemon directive,
; and the Redis wait moved into docker/supervisord.d/wait-for-stores.sh.

# Core settings
chdir = /app
module = dispatcharr.wsgi:application
virtualenv = /dispatcharrpy
master = true
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
env = USE_NGINX_ACCEL=true
socket = /app/uwsgi.sock
chmod-socket = 777
vacuum = true
die-on-term = true
static-map = /static=/app/static

# Worker management
workers = 4

# Worker stall detection and recycling (PR 4). The relay's own ini
# (docker/uwsgi.relay.ini) carries neither: this process no longer serves
# long-lived streams (docker/nginx.conf routes those to the relay), so
# they are safe here for the first time in this codebase's history. Under
# gevent, harakiri is a per-worker stall timer re-armed at every request
# boundary, not a per-request bound: on a busy worker, one stalled request
# is masked by any neighbour finishing. When it does fire it kills the
# whole gevent worker, and every other in-flight request on it, not just
# the one harakiri-verbose names.
harakiri = $(DISPATCHARR_API_HARAKIRI)
harakiri-verbose = true
max-requests = $(DISPATCHARR_API_MAX_REQUESTS)

# Optimize for streaming
http = 0.0.0.0:5656
http-keepalive = 1
buffer-size = 65536  # Increase buffer for large payloads
# No post-buffering here: uWSGI 2.0.31 keeps one harakiri deadline per
# worker, shared by every gevent core, and post-buffering's inc_harakiri()
# adds the interval to it (core/utils.c:45-52). When a neighbouring request
# has just closed and zeroed the deadline (core/utils.c:1119-1122), a body
# read turns it into a 1970 timestamp and the master SIGKILLs the whole
# worker within a second. core/request_body_spool.py reads the body
# before Django instead, gated by this env line, so a view that answers
# without reading a large body still sends a clean response.
# e2e/tests/guards/uwsgi-harakiri-post-buffering.spec.ts refuses both together.
# uWSGI's start-up "WARNING: you have enabled harakiri without post
# buffering" is expected: the body is buffered, by the line below.
env = MINO_WSGI_SPOOL_REQUEST_BODY=1
http-timeout = 600  # Prevent disconnects from long streams
socket-timeout = 600  # Prevent write timeouts when client buffers
lazy-apps = true  # Improve memory efficiency

# Async mode (use gevent for high concurrency)
gevent = 400  # Each unused greenlet costs ~2-4KB of memory
# Higher values have minimal performance impact when idle, but provide capacity for traffic spikes
# If memory usage becomes an issue, reduce this value

# Patch the stdlib (socket, threading, time, ...) before any app code
# loads so blocking calls yield to the gevent hub. Without this, a single
# blocking requests / DNS call freezes every greenlet on the
# worker. psycopg3 uses Python's socket layer, so no additional patching is needed.
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch

# Performance tuning
thunder-lock = true
log-4xx = true
log-5xx = true
disable-logging = false

# Logging configuration
# Enable console logging (stdout)
log-master = true
# Enable strftime formatting for timestamps
logformat-strftime = true
log-date = %%Y-%%m-%%d %%H:%%M:%%S,000
# Use formatted time with environment variable for log level
log-format = %(ftime) $(DISPATCHARR_LOG_LEVEL) uwsgi.requests Worker ID: %(wid) %(method) %(status) %(uri) %(msecs)ms
log-buffering = 1024  # Add buffer size limit for logging
