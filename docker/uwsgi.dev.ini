[uwsgi]
; Redis, Celery, Daphne and vite are supervisord programs now
; (docker/supervisord/all-dev.conf). --protected-mode no moved with Redis
; to docker/supervisord.d/redis-dev.conf, which is the only program that
; lowers it and says so.

# Core settings
chdir = /app
module = dispatcharr.wsgi:application
virtualenv = /dispatcharrpy
master = true
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
socket = /app/uwsgi.sock
chmod-socket = 777
vacuum = true
die-on-term = true
static-map = /static=/app/static

# Worker management
workers = 4

# Optimize for streaming
http = 0.0.0.0:5656
http-keepalive = 1
buffer-size = 65536  # Increase buffer for large payloads
post-buffering = 4096  # Reduce buffering for real-time streaming
http-timeout = 600  # Prevent disconnects from long streams
lazy-apps = true  # Improve memory efficiency

# Async mode (use gevent for high concurrency)
gevent = 100

# Patch the stdlib (socket, threading, time, ...) before any app code
# loads so blocking calls yield to the gevent hub. Without this, a single
# blocking requests / DNS call freezes every greenlet on the
# worker. psycopg3 uses Python's socket layer, so no additional patching is needed.
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch

# Performance tuning
thunder-lock = true
log-4xx = true
log-5xx = true
disable-logging = false

# Logging configuration - development mode
# Enable console logging (stdout)
log-master = true
# Enable strftime formatting for timestamps
logformat-strftime = true
log-date = %%Y-%%m-%%d %%H:%%M:%%S,000
# Use formatted time with environment variable for log level
# The request URI is the one nginx passes as REDACTED_REQUEST_URI
# (docker/request_log_redaction.conf), never the raw URI: Xtream clients carry
# the user's login in the path or query string. A request that did not come
# through nginx (the http listener on :5656, which is every request in the
# dev and debug rungs) carries no such var and logs "-" in its place.
# ignore-sigpipe and ignore-write-errors silence uWSGI's own client-gone
# lines ("... during GET <raw URI> (<ip>)"), which print the raw URI; the
# application still gets its OSError on a failed write
# (disable-write-exception stays unset), so disconnect handling is unchanged.
ignore-sigpipe = true
ignore-write-errors = true
log-format = %(ftime) $(DISPATCHARR_LOG_LEVEL) uwsgi.requests Worker ID: %(wid) %(method) %(status) %(var.REDACTED_REQUEST_URI) %(msecs)ms
log-buffering = 1024  # Add buffer size limit for logging
