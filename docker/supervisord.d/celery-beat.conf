[program:celery-beat]
command=nice -n %(ENV_CELERY_NICE_LEVEL)s setpriv --reuid=%(ENV_DISPATCHARR_CELERY_USER)s --regid=%(ENV_DISPATCHARR_CELERY_USER)s --init-groups /app/docker/supervisord.d/wait-for-stores.sh celery -A dispatcharr beat -l %(ENV_CELERY_LOG_LEVEL)s --pidfile=/run/celerybeat.pid
directory=/app
environment=HOME="%(ENV_DISPATCHARR_CELERY_HOME)s",USER="%(ENV_DISPATCHARR_CELERY_USER)s"
priority=222
autostart=true
autorestart=true
startretries=20
startsecs=5
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
