[program:vite]
command=npm run dev
directory=/app/frontend
user=%(ENV_POSTGRES_USER)s
environment=HOME="%(ENV_DISPATCHARR_HOME)s",USER="%(ENV_POSTGRES_USER)s"
priority=910
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
