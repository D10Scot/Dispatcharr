[program:redis]
command=redis-server --save "" --appendonly no
user=%(ENV_POSTGRES_USER)s
environment=HOME="%(ENV_DISPATCHARR_HOME)s",USER="%(ENV_POSTGRES_USER)s"
directory=/tmp
priority=110
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
