# Dispatcharr - Modular Deployment Configuration
# This compose file runs Dispatcharr in modular mode with separate containers
# for web, celery workers, PostgreSQL database, and Redis cache.

services:
  # ============================================================================
  # Web Service
  # ============================================================================
  web:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_web
    restart: unless-stopped
    # supervisord stops its programs one priority group at a time, waiting
    # for each to finish before signalling the next, so a rung's budget is
    # the sum of its programs' stopwaitsecs, not the largest of them. 160s
    # is used uniformly across every supervisord-based service here, sized
    # to the largest rung (all: 135s today, 155s once PR 4 adds
    # relay-uwsgi at 20s) so no service needs its own tuned value. This
    # web service actually runs role api, whose own rung sums to 30s
    # (uwsgi 10 + daphne 10 + nginx 10) -- the realistic stop is nearer
    # 90s, on the celery service's Celery workers using their full window
    # on warm shutdown with a task in flight.
    stop_grace_period: 160s
    ports:
      - 9191:9191
    volumes:
      - ./data:/data
      #- ./certs:/certs:ro  # TLS certificates (optional)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started, not service_healthy: the relay has no healthcheck,
      # and what nginx needs is only that the name resolves. nginx resolves
      # `upstream relay_py { server relay:5657; }` ONCE, at config load, so a
      # web container that starts with no relay container in DNS fails with
      # "host not found in upstream" and [program:nginx] goes BACKOFF then
      # FATAL -- taking the whole API surface down, not just streaming.
      relay:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- Environment Configuration ---
    environment:
      # Deployment Mode
      - DISPATCHARR_ENV=modular
      # Which supervisord programs this container runs: nginx, uwsgi and
      # daphne. This is also what the entrypoint would default to in
      # modular mode; stated explicitly so the compose file answers the
      # question on its own.
      - DISPATCHARR_ROLE=api

      # PostgreSQL Connection
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      # PostgreSQL TLS (optional) — mount certs via the volume above
      #- POSTGRES_SSL=true                             # required to enable TLS
      #- POSTGRES_SSL_MODE=verify-full                 # optional: verify-full (default) | verify-ca | require
      #- POSTGRES_SSL_CA_CERT=/certs/postgres/ca.crt   # optional: CA cert to verify the server
      #- POSTGRES_SSL_CERT=/certs/postgres/client.crt  # optional: client cert (only if server requires client auth)
      #- POSTGRES_SSL_KEY=/certs/postgres/client.key   # optional: client key  (only if server requires client auth)

      # Redis Connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Redis Authentication (Optional)
      # Uncomment and set if your Redis requires authentication:
      #- REDIS_PASSWORD=your_strong_redis_password
      #- REDIS_USER=your_redis_username  # For Redis 6+ ACL - see Redis service below
      # Redis TLS (optional) — mount certs via the volume above
      #- REDIS_SSL=true                                # required to enable TLS
      #- REDIS_SSL_VERIFY=true                         # optional: set false for self-signed certs without a CA
      #- REDIS_SSL_CA_CERT=/certs/redis/ca.crt         # optional: CA cert to verify the server
      #- REDIS_SSL_CERT=/certs/redis/client.crt        # optional: client cert (only if server requires client auth)
      #- REDIS_SSL_KEY=/certs/redis/client.key         # optional: client key  (only if server requires client auth)

      # Logging
      - DISPATCHARR_LOG_LEVEL=info

      # Internal Service Communication: nginx's RELAY_UPSTREAM sed
      # (docker/init/03-init-dispatcharr.sh) uses this to reach the relay
      # service below. It defaults to "relay" (the service name), so this
      # line only needs changing if the service is renamed.
      #
      # It must always name something DNS can resolve, though. nginx
      # resolves the relay_py upstream once, at config load, so a web
      # container brought up without a relay -- `docker compose up web`, or
      # a cut-down compose file -- fails config load outright unless this
      # points somewhere resolvable. 127.0.0.1 is the answer in that case:
      # it resolves, and streaming simply 502s, leaving the API up.
      - DISPATCHARR_RELAY_HOST=relay

      # First-time web setup from a public IP (optional). When unset, only
      # local/private networks may POST to initialize-superuser.
      #- DISPATCHARR_SETUP_ALLOWED_IP=203.0.113.50

      # Outer reverse proxy trust (optional). When unset, private/loopback peers
      # may set X-Real-IP / X-Forwarded-For (typical Docker/Traefik setups).
      # Set to a specific IP/CIDR to narrow trust, or none to ignore proxy headers.
      #- DISPATCHARR_TRUSTED_PROXIES=172.18.0.0/16
      #- DISPATCHARR_TRUSTED_PROXIES=none

      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features:
      #- USE_LEGACY_NUMPY=true

      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (see below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)

    # --- Advanced Configuration ---
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE

    # --- Hardware Acceleration (Optional) ---
    # Uncomment for GPU access (transcoding acceleration)
    #group_add:
    #  - video
    #  #- render  # Uncomment if your GPU requires it
    #devices:
    #  - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)

    # NVIDIA GPU Support (requires NVIDIA Container Toolkit)
    # Uncomment the following lines for NVIDIA GPU support
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]

  # ============================================================================
  # Relay Service — the streaming relay's own uWSGI process (Phase 1 PR 4)
  # ============================================================================
  relay:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_relay
    restart: unless-stopped
    # DISPATCHARR_RELAY_PORT (unset here, default 5657) is honoured on both
    # ends: nginx's RELAY_UPSTREAM sed (docker/init/03-init-dispatcharr.sh)
    # substitutes it into the web service's upstream, and this container's
    # own uwsgi.relay.ini binds `socket = 0.0.0.0:$(DISPATCHARR_RELAY_PORT)`
    # — set it on both services together, never just one.
    # Same rationale as web/celery above: 160s is used uniformly across
    # every supervisord-backed service here, sized to the largest rung's
    # summed stopwaitsecs rather than tuned per-service. This rung sums to
    # 20s (relay-uwsgi alone).
    stop_grace_period: 160s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Same volume as web and celery: SECRET_KEY comes from /data/jwt
      # (docker/entrypoint.sh), and a relay that generates its own key
      # 403s every internal call once PR 5/6 add internal HMAC auth (D11).
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - DISPATCHARR_ENV=modular
      - DISPATCHARR_ROLE=relay

      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret

      - REDIS_HOST=redis
      - REDIS_PORT=6379

      - DISPATCHARR_LOG_LEVEL=info

      - DJANGO_SETTINGS_MODULE=dispatcharr.settings
      - PYTHONUNBUFFERED=1

      # Process Priority Configuration (Optional)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)

    # --- Advanced Configuration ---
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE

    # --- Hardware Acceleration (Optional) ---
    # Uncomment for GPU access (transcoding acceleration) -- the relay is
    # where ffmpeg actually runs after this PR.
    #group_add:
    #  - video
    #  #- render  # Uncomment if your GPU requires it
    #devices:
    #  - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)

  # ============================================================================
  # Celery Service - Background task worker
  # ============================================================================
  celery:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr_celery
    restart: unless-stopped
    # Both Celery workers carry stopwaitsecs=30 for a task in flight, and
    # supervisord waits for each in turn — see the web service above.
    stop_grace_period: 160s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      # PUID/PGID must match the web service (and any future relay service) — they share this /data volume, and only web/api's 03-init-dispatcharr.sh chowns it.
      - ./data:/data
      #- ./certs:/certs:ro  # TLS certificates (optional)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- Environment Configuration ---
    environment:
      # Deployment Mode
      - DISPATCHARR_ENV=modular
      # Which supervisord programs this container runs: the three Celery
      # programs and nothing else. Replaces the entrypoint override that
      # used to point at docker/entrypoint.celery.sh.
      - DISPATCHARR_ROLE=worker

      # Internal Service Communication
      # Celery uses these to reach the web container for DVR recording.
      # DISPATCHARR_PORT must match the port exposed by the web service.
      # DISPATCHARR_WEB_HOST defaults to "web" (the service name above).
      # Only set DISPATCHARR_WEB_HOST if you rename the web service in this file.
      - DISPATCHARR_PORT=9191
      #- DISPATCHARR_WEB_HOST=web

      # PostgreSQL — must match web service settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
      # PostgreSQL TLS — must match web service
      #- POSTGRES_SSL=true
      #- POSTGRES_SSL_MODE=verify-full
      #- POSTGRES_SSL_CA_CERT=/certs/postgres/ca.crt
      #- POSTGRES_SSL_CERT=/certs/postgres/client.crt
      #- POSTGRES_SSL_KEY=/certs/postgres/client.key

      # Redis — must match web service settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      #- REDIS_PASSWORD=your_strong_redis_password
      #- REDIS_USER=your_redis_username
      # Redis TLS — must match web service
      #- REDIS_SSL=true
      #- REDIS_SSL_VERIFY=true
      #- REDIS_SSL_CA_CERT=/certs/redis/ca.crt
      #- REDIS_SSL_CERT=/certs/redis/client.crt
      #- REDIS_SSL_KEY=/certs/redis/client.key

      # Logging
      - DISPATCHARR_LOG_LEVEL=info

      # Process Priority Configuration (Optional)
      #- CELERY_NICE_LEVEL=5  # Celery/EPG/Background tasks (default: 5, low priority; Range: -20 to 19)

      # Legacy CPU Support (Optional)
      # Uncomment to enable legacy NumPy build for older CPUs (circa 2009)
      # that lack support for newer baseline CPU features:
      #- USE_LEGACY_NUMPY=true

      # Django Configuration
      - DJANGO_SETTINGS_MODULE=dispatcharr.settings
      - PYTHONUNBUFFERED=1

    # --- Advanced Configuration ---
    # Uncomment to enable high priority for Celery (required if CELERY_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  db:
    image: postgres:17
    container_name: dispatcharr_db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_DB=dispatcharr
      - POSTGRES_USER=dispatch
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatcharr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis
  # ============================================================================
  redis:
    image: redis:latest
    container_name: dispatcharr_redis
    restart: unless-stopped

    # --- Authentication Configuration (Optional) ---
    # By default, Redis runs without authentication.
    # Choose ONE of the following options if authentication is required:

    # Option 1: Password-only authentication (Redis <6 or default user)
    #command: ["redis-server", "--requirepass", "your_strong_redis_password"]

    # Option 2: Redis 6+ ACL with username + password (requires custom config file - see Redis documentation for configuration)
    #command: ["redis-server", "/etc/redis/redis.conf"]
    #volumes:
    #  - ./redis.conf:/etc/redis/redis.conf:ro

    # --- Health Check Configuration ---
    healthcheck:
      # Default: No authentication
      test: ["CMD", "redis-cli", "ping"]

      # If using Option 1 (password-only), uncomment this instead:
      #test: ["CMD", "redis-cli", "-a", "your_strong_redis_password", "ping"]

      # If using Option 2 (Redis 6+ ACL), uncomment this instead:
      #test: ["CMD", "redis-cli", "--user", "your_redis_username", "-a", "your_strong_redis_password", "ping"]

      interval: 5s
      timeout: 5s
      retries: 5

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
