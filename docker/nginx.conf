# Channel/VOD logos and SD program posters share /data/cache/ with separate zones.
proxy_cache_path /data/cache/logos levels=1:2 keys_zone=logo_cache:10m
                 inactive=24h use_temp_path=off;

proxy_cache_path /data/cache/sd_posters levels=1:2 keys_zone=sd_poster_cache:10m
                 inactive=14d use_temp_path=off;

# The relay's uWSGI process (Phase 1 PR 4). A literal upstream group name,
# not a bare address in a variable: uwsgi_pass to a variable needs a
# resolver, uwsgi_pass to a declared upstream group does not. RELAY_UPSTREAM
# is a bare placeholder with no $, sed'd at boot exactly like NGINX_PORT
# (docker/init/03-init-dispatcharr.sh) -- 127.0.0.1:5657 outside modular,
# <relay host>:<relay port> in modular.
#
# nginx resolves this name ONCE, at config load. In modular mode a `web`
# container started with no `relay` container in DNS fails config load
# outright ("host not found in upstream"), which is why
# docker/docker-compose.yml gives `web` a depends_on on `relay`, and why
# recreating the relay with a new IP needs `nginx -s reload` in the web
# container.
upstream relay_py {
    server RELAY_UPSTREAM;
}

# $relay_name is set per relay-bound location by auth_request_set, from the
# X-Relay-Name header the authorize hop returns (settings.RELAY_DEFAULT_NAME,
# "py" in Phase 1). auth_request_set is the ONLY context in which a
# subrequest's response headers are readable, which is why the map keys on
# $relay_name rather than on $upstream_http_x_relay_name.
#
# The values are upstream GROUP names, not addresses: uwsgi_pass to a
# variable holding a bare host:port needs a `resolver` and fails without
# one, while a declared group needs none. Phase 2's canary is a second map
# entry and a second upstream block — not a code change on either side
# (ADR 0005). `default` covers the two relay-bound locations that run no
# subrequest, where $relay_name is unset.
map $relay_name $relay_upstream {
    default relay_py;
    py      relay_py;
}

server {
    listen NGINX_PORT;
    listen [::]:NGINX_PORT;

    proxy_connect_timeout 75;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    client_max_body_size 0;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --- Exact matches: short JSON control routes that stay on the API,
    # plus the one exact relay route below. An exact match wins outright
    # over every prefix and regex location, so order among these seven
    # doesn't matter, and none needs ^~. ---
    location = /proxy/ts/status {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location = /proxy/vod/stats/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location = /proxy/vod/stop_client/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location = /proxy/catchup/stats/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location = /proxy/catchup/programs/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location = /proxy/catchup/stop_client/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    # /streaming/timeshift.php (dispatcharr/urls.py timeshift_proxy_query)
    # is long-lived, like the catchup/<uuid> route below.
    location = /streaming/timeshift.php {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }

    # The authorize hop (Phase 1 PR 5, ADR 0005). `internal;` means nginx
    # serves it only for a subrequest — a client asking for this URI
    # directly gets 404 from nginx, never Django. It goes to the API
    # process like every other Django-bound location: auth_request
    # subrequests do not follow the relay's upstream.
    location = /_dispatcharr/authorize {
        internal;
        include /etc/nginx/dispatcharr_api_params.conf;
        # The subrequest's own URI is this location, so the URI being
        # authorized has to be forwarded explicitly. $request_uri is the
        # parent request's unparsed URI, query string included — the
        # uwsgi_pass equivalent of the auth_request docs' X-Original-URI.
        uwsgi_param HTTP_X_ORIGINAL_URI $request_uri;
        uwsgi_pass_request_body off;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    # --- ^~ prefixes: the longest matching one wins outright, no regex is
    # consulted for it. Order among ^~ locations does not matter to nginx
    # (longest prefix wins regardless of file order); grouped here by
    # destination for readability only. ---
    location ^~ /api/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;

        location ~ ^/api/channels/logos/(?<logo_id>\d+)/cache/ {
            proxy_pass http://127.0.0.1:5656;
            proxy_cache logo_cache;
            proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
            proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
            proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
            proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
        }

        location ~ ^/api/vod/vodlogos/(?<logo_id>\d+)/cache/ {
            proxy_pass http://127.0.0.1:5656;
            proxy_cache logo_cache;
            proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
            proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
            proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
            proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
        }

        # Parent-scoped VOD images (backdrops, episode stills, etc.)
        location ~ ^/api/vod/(movies|series|episodes)/(?<vod_id>\d+)/image/ {
            proxy_pass http://127.0.0.1:5656;
            proxy_cache logo_cache;
            proxy_cache_key "$scheme$request_uri";
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
        }

        # SD program posters: 14d nginx cache. Clients pass ?v=<hash of sd_icon>
        # Do not add proxy_cache_valid 404 here. Bare HTTP 404s from SD/CDN are treated
        # as transient in the poster proxy (only code 5000 blacklists); a negative cache
        # would delay legitimate retries. Permanent misses are handled in Django/DB.
        location ~ ^/api/epg/programs/(?<prog_id>\d+)/poster/ {
            proxy_pass http://127.0.0.1:5656;
            proxy_cache sd_poster_cache;
            proxy_cache_key "$scheme$request_uri";
            proxy_cache_valid 200 14d;
            proxy_cache_use_stale error timeout updating;
        }

        # The one long-lived response under /api/: RecordingViewSet.file
        # (apps/channels/api_views.py) is a StreamingHttpResponse of the
        # recorded MKV/MP4 with Range support, played back by the DVR UI --
        # hours long, not seconds. Left on the API it would be killed by the
        # new harakiri = 120 partway through every playback, taking the
        # worker's other ~400 in-flight requests with it. Routed here
        # instead: same urlconf, same view, same DRF authentication (D1),
        # only a different process. The trailing slash is DefaultRouter's
        # (trailing_slash=True); a slashless request 301s from the ^~ /api/
        # block above and comes back here.
        # Deliberately outside the authorize hop: its gate is DRF
        # authentication plus network_access_allowed("STREAMS") on
        # RecordingViewSet.file, which is not a surface authorize_stream()
        # knows, so it gets no row in the authorize matrix. It carries the
        # blanking include like a non-relay location, so a client-supplied
        # X-Relay-* header never reaches the relay on this path.
        location ~ ^/api/channels/recordings/\d+/file/$ {
            include /etc/nginx/dispatcharr_api_params.conf;
            uwsgi_buffering off;
            uwsgi_read_timeout 300s;
            uwsgi_send_timeout 300s;
            client_max_body_size 0;
            uwsgi_pass relay_py;
        }
    }
    location ^~ /assets/ {
        root /app/static;
    }
    location ^~ /static/ {
        root /app;
    }
    location ^~ /logos/ {
        root /data;
    }
    # Internal location for X-Accel-Redirect backup downloads
    # Django handles auth, nginx serves the file directly
    location ^~ /protected-backups/ {
        internal;
        alias /data/backups/;
    }
    # New in this PR: /output/m3u/<profile_name> and /output/epg/<profile_name>
    # (apps/output/urls.py) are 3-segment, no-trailing-slash URIs the API
    # owns -- ^~ takes them out of the XC three-segment regex's reach (D7).
    location ^~ /output/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    # /hdhr/<channel_profile>/discover.json and its siblings are also
    # 3-segment, no-trailing-slash -- same reasoning as /output/ above.
    location ^~ /hdhr {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
    # Everything else under /proxy/ that the more specific ^~ locations
    # below don't claim: /proxy/ts/{change_stream,status/<id>,stop,
    # stop_client,next_stream}, all short and IsAdmin.
    location ^~ /proxy/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }
    # Relay-bound, and therefore authorized once per tune before a byte
    # moves: 2xx allows, 401/403 are returned to the client verbatim,
    # anything else is nginx's own error — including an unreachable API
    # process, which is a 500 here rather than the 502/504 a failed
    # uwsgi_pass would give (amendment S7). The six auth_request_set lines
    # are the only way to read the subrequest's response headers; the
    # uwsgi_param lines
    # re-emit them toward the relay AND override whatever the client sent
    # under the same names, which is the second of the two layers that
    # make the marker unforgeable. The first is that RELAY_TRUST_TOKEN is
    # HMAC(SECRET_KEY, "relay-trust"), sed'd in at boot by
    # docker/init/03-init-dispatcharr.sh — not the literal "1" — because
    # nginx is not always in front of this port.
    #
    # error_page 403 exists because the module carries only 401 and 403:
    # the hop sends every 404 and 429 decision as a 403 naming the real
    # code in X-Authorize-Status, and @authorize_denied puts it back.
    location ^~ /proxy/ts/stream/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    location ^~ /proxy/vod/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    location ^~ /proxy/catchup/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    # No route exists behind this yet (PR 7 adds the relay control API);
    # added now because PR 4 writes the full location table in one shot,
    # and D1 means a request here today just 404s from Django, harmlessly.
    # It is reachable without authentication -- noted in the PR body, and
    # the reason PR 7 must not mount anything here without its own auth.
    # Deliberately outside the authorize hop: PR 7's relay control API
    # is gated by the internal token alone (D9), and authorize_stream()
    # would 404 a URI that names no channel. Blanking include for the
    # same reason as above.
    location ^~ /proxy/relay/ {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass relay_py;
    }
    location ^~ /live/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    location ^~ /movie/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    location ^~ /series/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }
    location ^~ /timeshift/ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }

    # --- Regexes, first match in file order wins. Admin must precede the
    # XC three-segment form (D7): /admin/<password>/<channel_id> (XC
    # username "admin") is deliberately excluded by the admin regex's own
    # negative lookahead and must fall through to the XC regex below it. ---

    # Admin UI disabled outside dedicated admin access. Match /admin and all
    # deeper Django admin paths (e.g. /admin/login/), but do not match the
    # three-segment XC stream form /admin/<password>/<channel_id> used when
    # the XC username is literally "admin".
    location ~ ^/admin(?!/[^/]+/[^/]+/?$)(?:/|$) {
        return 301 /login;
    }
    # The XC three-segment root form: the bare <user>/<pass>/<id> mount at
    # the site root (dispatcharr/urls.py), long-lived. The id segment
    # mirrors XC_STREAM_ID_PATTERN in dispatcharr/utils.py (narrowed by
    # PR 2): digits, optionally with a file extension. A same-shaped SPA
    # deep link (e.g. /settings/example/page) does not match and falls
    # through to `location /` instead of hitting the relay and 403ing.
    location ~ ^/[^/]+/[^/]+/\d+(?:\.[A-Za-z0-9]+)?$ {
        auth_request /_dispatcharr/authorize;
        auth_request_set $relay_name    $upstream_http_x_relay_name;
        auth_request_set $relay_channel $upstream_http_x_relay_channel;
        auth_request_set $relay_output  $upstream_http_x_relay_output;
        auth_request_set $relay_client  $upstream_http_x_relay_client;
        auth_request_set $relay_user    $upstream_http_x_relay_user;
        auth_request_set $authorize_status $upstream_http_x_authorize_status;
        error_page 403 = @authorize_denied;

        include uwsgi_params;
        uwsgi_param HTTP_X_DISPATCHARR_AUTHORIZED "RELAY_TRUST_TOKEN";
        uwsgi_param HTTP_X_RELAY_CHANNEL $relay_channel;
        uwsgi_param HTTP_X_RELAY_OUTPUT  $relay_output;
        uwsgi_param HTTP_X_RELAY_CLIENT  $relay_client;
        uwsgi_param HTTP_X_RELAY_USER    $relay_user;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
        uwsgi_pass $relay_upstream;
    }

    # --- Plain prefix fallback: SPA + everything else. NEVER ^~ -- that
    # would disable every regex above, including the two just written. ---
    location / {
        include /etc/nginx/dispatcharr_api_params.conf;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    # Restores the status the authorize hop actually decided.
    # ngx_http_auth_request_module denies with 401 or 403 verbatim and
    # treats every other subrequest status as an error — which reaches the
    # client as 500 — so the hop collapses 404 and 429 into a 403 naming
    # the real code in X-Authorize-Status, and this puts it back. Without
    # it, an unknown channel id in a cached playlist would answer 500
    # where it answers 404 today, and a viewer over their stream limit
    # would answer 500 where they get 429 today.
    #
    # `if` rather than a `map` because `return` takes a literal code, not
    # a variable. No request body is touched and no rewrite runs here, so
    # this is not the documented `if`-in-location trap.
    #
    # error_page is declared per relay-bound location and deliberately NOT
    # at server level. It would not recurse if it were — with
    # recursive_error_pages off, the default, nginx marks the request on
    # the first redirect and never applies error_page again — but it would
    # route every other 403 in this server here too: a static file's, an
    # internal location's, one the relay itself returned, each handed
    # whatever $authorize_status happened to hold.
    #
    # uwsgi_intercept_errors is off by default, so a 403 the relay itself
    # produces is never routed here — only the subrequest's denial is.
    location @authorize_denied {
        if ($authorize_status = 404) { return 404; }
        if ($authorize_status = 429) { return 429; }
        return 403;
    }
}
