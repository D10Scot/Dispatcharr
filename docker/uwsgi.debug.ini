[uwsgi]
; Redis, Celery, Daphne and vite are supervisord programs now. Debug shares
; the dev rung (docker/supervisord/all-dev.conf), because
; docker-compose.debug.yml sets DISPATCHARR_ENV=dev as well as
; DISPATCHARR_DEBUG=true and the pre-supervisord entrypoint already ran
; vite and no nginx on that basis; DISPATCHARR_DEBUG selects this ini and
; nothing else.

# Core settings
chdir = /app
module = scripts.debug_wrapper:application
virtualenv = /dispatcharrpy
master = true
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
socket = /app/uwsgi.sock
chmod-socket = 777
vacuum = true
die-on-term = true
static-map = /static=/app/static

# Worker configuration
workers = 1
lazy-apps = true

# HTTP server
http = 0.0.0.0:5656
http-keepalive = 1
buffer-size = 65536
http-timeout = 600

# Async mode (use gevent for high concurrency)
gevent = 100

# Patch the stdlib (socket, threading, time, ...) before any app code
# loads so blocking calls yield to the gevent hub. Without this, a single
# blocking requests / DNS call freezes every greenlet on the
# worker. psycopg3 uses Python's socket layer, so no additional patching is needed.
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch

# Performance tuning
thunder-lock = true
log-4xx = true
log-5xx = true
disable-logging = false
log-buffering = 1024  # Add buffer size limit for logging

; Longer timeouts for debugging sessions
harakiri = 3600
socket-timeout = 3600
http-timeout = 3600


# Ignore unknown options
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

# Debugging settings
# Reload API workers: touch /app/.uwsgi-reload
; py-autoreload = 1
touch-workers-reload = /app/.uwsgi-reload
; honour-stdin removed with the move to supervisord (D2): a supervisord
; child has no controlling TTY, so uWSGI would hold a stdin that is never a
; terminal. Nothing is lost — debugpy attaches over TCP :5678, never over
; stdin, and the interactive pdb the flag existed for was already
; unreachable through `docker logs`.

# Environment variables
env = PYTHONPATH=/app
env = PYTHONUNBUFFERED=1
env = PYDEVD_DISABLE_FILE_VALIDATION=1
env = PYTHONUTF8=1
env = PYTHONXOPT=-Xfrozen_modules=off
env = PYDEVD_DEBUG=1
env = DEBUGPY_LOG_DIR=/app/debugpy_logs
env = GEVENT_SUPPORT=true

# Debugging control variables
env = WAIT_FOR_DEBUGGER=false
env = DEBUG_TIMEOUT=30

# Enable console logging (stdout)
log-master = true
# Enable strftime formatting for timestamps
logformat-strftime = true
log-date = %%Y-%%m-%%d %%H:%%M:%%S,000
# Use the environment variable in log format - ensure consistent formatting with other files
log-format = %(ftime) $(DISPATCHARR_LOG_LEVEL) uwsgi.requests Worker ID: %(wid) %(method) %(status) %(uri) %(msecs)ms