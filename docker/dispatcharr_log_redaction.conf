# Included at the top of nginx.conf (http context). Builds
# $redacted_request_uri, the request URI with every Xtream credential and
# every sensitive query value masked as ***, and the access log format that
# logs it. The same variable reaches both uWSGI processes as the uwsgi var
# REDACTED_REQUEST_URI, which their log-format prints instead of %(uri).
#
# Why: Xtream clients carry the user's login in the path
# (/live|movie|series|timeshift/<user>/<pass>/..., and the bare
# /<user>/<pass>/<id> root route) or in the query string (player_api.php,
# get.php, xmltv.php, streaming/timeshift.php), the browser carries its JWT
# as /ws/?token=, and the SSO callback carries code= and state=. nginx's
# default "combined" access log prints $request, and uWSGI's %(uri) prints
# REQUEST_URI, both verbatim.
#
# The masks follow dispatcharr/utils.py's redact_url: the two segments after
# a live/movie/series/timeshift prefix, the first two of a three-segment path
# whose last segment starts with a digit, and the value of every query
# parameter named in SENSITIVE_QUERY_KEYS (exact name, any case). A map
# cannot substitute globally, so the query masks are four chained maps, each
# masking one not-yet-masked value; a query that still holds an unmasked
# sensitive value after four, or that has a percent-encoded parameter name
# (Django decodes names, so user%6Eame= is username=), is replaced whole.
#
# Fail closed on spelling: the masks read the raw $request_uri, which is what
# the relay and Django receive, so a %2F inside a username stays inside its
# segment. A path whose spelling nginx or Django could still decode or
# normalise into another shape is logged whole as /*** (see below).
#
# e2e/tests/guards/request-log-redaction.spec.ts executes these maps against
# a table of cases and pins the format and every log sink that could bypass
# them; edit the two together.

map $request_uri $dispatcharr_log_raw_path {
    "~^([^?]*)"  $1;
}

map $request_uri $dispatcharr_log_raw_query {
    "~^[^?]*\?(.*)$"  $1;
    default           "";
}

map $request_uri $dispatcharr_log_has_query {
    "~\?"    1;
    default  0;
}

# X = a dot segment, M = a mask fired, U = the raw path is unchanged.
map $dispatcharr_log_raw_path $dispatcharr_log_path_tagged {
    "~/\.\.?(?:/|$)"                                                X;
    "~*^(/+(?:live|movie|series|timeshift)/+)[^/]*/+[^/]*(/.*)?$"  M$1***/***$2;
    "~*^(/+(?:live|movie|series|timeshift)/+)[^/]*$"               M$1***;
    "~^/+(?!(?:api|hls|ws)/)[^/]+/+[^/]+/+(\d[^/]*)$"              M/***/***/$1;
    default                                                         U$dispatcharr_log_raw_path;
}

# A path is logged whole as /*** when it holds a dot segment or, after
# masking, a percent-encoding. nginx routes on the decoded, normalised
# URI and Django reads the decoded PATH_INFO, so such a spelling
# (/l%69ve/..., /a/../live/..., /<user>/<pass>/%31, /live/../<user>/<pass>/1)
# can put credentials where no mask above looked. Keyed on the raw URI only,
# never on $uri: an auth_request subrequest shares its parent's variable
# cache, and evaluated there $uri is /_dispatcharr/authorize.
map $dispatcharr_log_path_tagged $dispatcharr_log_path {
    "~^X"            /***;
    "~^[MU].*%"      /***;
    "~^[MU](.*)$"    $1;
}

map $dispatcharr_log_raw_query $dispatcharr_log_query_1 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $dispatcharr_log_raw_query;
}

map $dispatcharr_log_query_1 $dispatcharr_log_query_2 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $dispatcharr_log_query_1;
}

map $dispatcharr_log_query_2 $dispatcharr_log_query_3 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $dispatcharr_log_query_2;
}

map $dispatcharr_log_query_3 $dispatcharr_log_query_4 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $dispatcharr_log_query_3;
}

map $dispatcharr_log_query_4 $dispatcharr_log_query {
    "~*(?:^|&)(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=(?!\*\*\*(?:&|$))"  ***;
    "~(?:^|&)[^=&]*%[^=&]*="  ***;
    default  $dispatcharr_log_query_4;
}

map $dispatcharr_log_has_query $redacted_request_uri {
    1        "$dispatcharr_log_path?$dispatcharr_log_query";
    default  $dispatcharr_log_path;
}

# "combined" with $redacted_request_uri in place of $request, and with the
# two fields that can carry a credential nginx does not mask dropped:
# $remote_user (an HTTP Basic username) and $http_referer (a page URL that
# may carry ?token=). $upstream_addr, $upstream_status and $request_time are
# added because nginx.conf lowers the error log to alert for this server, so
# the access log is where a failed upstream is now visible.
log_format dispatcharr_redacted '$remote_addr - - [$time_local] '
                                '"$request_method $redacted_request_uri $server_protocol" '
                                '$status $body_bytes_sent "$http_user_agent" '
                                'rt=$request_time upstream=$upstream_addr '
                                'upstream_status=$upstream_status';
