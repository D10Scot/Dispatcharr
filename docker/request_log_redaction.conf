# Included at the top of nginx.conf (http context). Builds
# $log_redacted_request_uri, the request URI with every Xtream credential,
# HLS media-session token and sensitive query value masked as ***, and the
# access log format that logs it. The same variable reaches both uWSGI
# processes as the uwsgi var REDACTED_REQUEST_URI, which their log-format
# prints instead of the raw URI.
#
# Why: Xtream clients carry the user's login in the path
# (/live|movie|series|timeshift/<user>/<pass>/..., and the bare
# /<user>/<pass>/<id> root route) or in the query string (player_api.php,
# get.php, xmltv.php, streaming/timeshift.php), the browser carries its JWT
# as /ws/?token=, the SSO callback carries code= and state=, and the token in
# /hls/<token>/... is an HLS session's whole authorization. nginx's default
# "combined" access log prints $request, and uWSGI's default prints
# REQUEST_URI, both verbatim.
#
# The masks follow redact_url (the project utils module): the two segments
# after a live/movie/series/timeshift prefix, the first two of a
# three-segment path whose last segment starts with a digit, and the value of
# every query parameter named in SENSITIVE_QUERY_KEYS (exact name, any case).
# A map cannot substitute globally, so the query masks are four chained maps,
# each masking one not-yet-masked value; a query that still holds an unmasked
# sensitive value after four, or that has a percent-encoded parameter name
# (Django decodes names, so user%6Eame= is username=), is replaced whole.
#
# Fail closed on spelling: a path holding any percent-encoding or any dot
# segment is logged whole as /***, decided on the raw path before any mask.
# nginx routes on the decoded, normalised URI and Django reads the decoded
# PATH_INFO, so an encoded dot or slash can move the credentials to segments
# a mask does not cover (/movie/x/%2E%2E/<user>/<pass>/5.mp4), and once the
# mask has replaced the segments that held the encoding nothing is left to
# see. Keyed on the raw $request_uri only, never on $uri: an auth_request
# subrequest shares its parent's variable cache, and evaluated there $uri is
# the authorize location's.
#
# These run in nginx's event loop on unauthenticated input, so every pattern
# is kept linear: adjacent repeated classes are disjoint, or the tail after
# them always matches. A class that overlaps the next one before a required
# character (the old [^=&]*%[^=&]*=) backtracks quadratically.
#
# e2e/tests/guards/request-log-redaction.spec.ts executes these maps against
# a table of cases and pins the format and every log sink that could bypass
# them; edit the two together.

map $request_uri $log_raw_path {
    "~^([^?]*)"  $1;
}

map $request_uri $log_raw_query {
    "~^[^?]*\?(.*)$"  $1;
    default           "";
}

map $request_uri $log_has_query {
    "~\?"    1;
    default  0;
}

# X = fail closed, M = a mask fired, U = the raw path is unchanged.
map $log_raw_path $log_path_tagged {
    "~%|/\.\.?(?:/|$)"                                             X;
    "~*^(/+(?:live|movie|series|timeshift)/+)[^/]*/+[^/]*(/.*)?$"  M$1***/***$2;
    "~*^(/+(?:live|movie|series|timeshift)/+)[^/]*$"               M$1***;
    "~*^(/+hls/+)[^/]+(.*)$"                                       M$1***$2;
    "~^/+(?!(?:api|hls|ws)/)[^/]+/+[^/]+/+(\d[^/]*/*)$"            M/***/***/$1;
    default                                                        U$log_raw_path;
}

map $log_path_tagged $log_path {
    "~^X"          /***;
    "~^[MU](.*)$"  $1;
}

map $log_raw_query $log_query_1 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $log_raw_query;
}

map $log_query_1 $log_query_2 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $log_query_1;
}

map $log_query_2 $log_query_3 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $log_query_2;
}

map $log_query_3 $log_query_4 {
    "~*^((?:.*&)?(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=)(?!\*\*\*(?:&|$))[^&]*(.*)$"  $1***$2;
    default  $log_query_3;
}

map $log_query_4 $log_query {
    "~*(?:^|&)(?:username|password|token|api_key|code|state|session_state|id_token|access_token|refresh_token|client_secret|client_assertion|code_verifier)=(?!\*\*\*(?:&|$))"  ***;
    "~(?:^|&)[^=&%]*%[^=&]*="  ***;
    default  $log_query_4;
}

map $log_has_query $log_redacted_request_uri {
    1        "$log_path?$log_query";
    default  $log_path;
}

# "combined" with $log_redacted_request_uri in place of $request, and with
# the two fields that can carry a credential nginx does not mask dropped:
# $remote_user (an HTTP Basic username) and $http_referer (a page URL that
# may carry ?token=). $upstream_addr, $upstream_status and $request_time are
# added because nginx.conf lowers the error log to alert for this server, so
# the access log is where a failed upstream is now visible.
log_format redacted '$remote_addr - - [$time_local] '
                    '"$request_method $log_redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" '
                    'rt=$request_time upstream=$upstream_addr '
                    'upstream_status=$upstream_status';
