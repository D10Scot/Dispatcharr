name: Base Image Build

on:
  push:
    branches: [main]
    paths:
      - 'docker/DispatcharrBase'
      - '.github/workflows/base-image.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'docker/DispatcharrBase'
      - '.github/workflows/base-image.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch: # Allow manual triggering
  schedule:
    # Weekly rebuild independent of any change in this repo: OS-level CVEs
    # in the apt packages this base pulls in get fixed upstream on their own
    # schedule, and `apt-get upgrade` (see docker/DispatcharrBase) only ever
    # runs when *something* triggers a build.
    - cron: '0 4 * * 0' # Sunday 04:00 UTC

permissions:
  contents: read

concurrency:
  group: base-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      repo_owner: ${{ steps.meta.outputs.repo_owner }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp for build
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Set repository and image metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          # Get lowercase repository owner
          REPO_OWNER=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

          # Get repository name
          REPO_NAME=$(echo "${REPOSITORY}" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT

          # Determine branch name
          if [[ "${REF}" == "refs/heads/main" ]]; then
            echo "branch_tag=base" >> $GITHUB_OUTPUT
          else
            # For other branches, use the branch name
            BRANCH=$(echo "${REF}" | sed 's/refs\/heads\///' | sed 's/[^a-zA-Z0-9]/-/g')
            echo "branch_tag=base-${BRANCH}" >> $GITHUB_OUTPUT
          fi

  docker:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.repo_name }}
            org.opencontainers.image.description=Your ultimate IPTV & stream Management companion.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.branch_tag }}-${{ needs.prepare.outputs.timestamp }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=See repository
            org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/
            org.opencontainers.image.vendor=${{ needs.prepare.outputs.repo_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            maintainer=${{ github.actor }}
            build_version=DispatcharrBase version: ${{ needs.prepare.outputs.branch_tag }}-${{ needs.prepare.outputs.timestamp }}

      - name: Build and push Docker base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./docker/DispatcharrBase
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/${{ matrix.platform }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.branch_tag }}-${{ matrix.platform }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.branch_tag }}-${{ needs.prepare.outputs.timestamp }}-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPO_OWNER=${{ needs.prepare.outputs.repo_owner }}
            REPO_NAME=${{ needs.prepare.outputs.repo_name }}
            BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
            TIMESTAMP=${{ needs.prepare.outputs.timestamp }}

  create-manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest tags
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_BRANCH_TAG: ${{ needs.prepare.outputs.branch_tag }}
          PREP_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OWNER=${PREP_REPO_OWNER}
          REPO=${PREP_REPO_NAME}
          BRANCH_TAG=${PREP_BRANCH_TAG}
          TIMESTAMP=${PREP_TIMESTAMP}

          echo "Creating multi-arch manifest for ${OWNER}/${REPO}"

          # GitHub Container Registry manifests
          # branch tag (e.g. base, or base-<branch> for a manual dispatch)
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PREP_REPO_NAME}" \
            --annotation "index:org.opencontainers.image.description=Your ultimate IPTV & stream Management companion." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${BRANCH_TAG}-${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.licenses=See repository" \
            --annotation "index:org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/" \
            --annotation "index:org.opencontainers.image.vendor=${OWNER}" \
            --annotation "index:org.opencontainers.image.authors=${ACTOR}" \
            --annotation "index:maintainer=${ACTOR}" \
            --annotation "index:build_version=DispatcharrBase version: ${BRANCH_TAG}-${TIMESTAMP}" \
            --tag ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG} \
            ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-amd64 ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-arm64

          # branch + timestamp tag
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PREP_REPO_NAME}" \
            --annotation "index:org.opencontainers.image.description=Your ultimate IPTV & stream Management companion." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${BRANCH_TAG}-${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.licenses=See repository" \
            --annotation "index:org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/" \
            --annotation "index:org.opencontainers.image.vendor=${OWNER}" \
            --annotation "index:org.opencontainers.image.authors=${ACTOR}" \
            --annotation "index:maintainer=${ACTOR}" \
            --annotation "index:build_version=DispatcharrBase version: ${BRANCH_TAG}-${TIMESTAMP}" \
            --tag ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-${TIMESTAMP} \
            ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-${TIMESTAMP}-amd64 ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-${TIMESTAMP}-arm64

  sign-and-attest:
    # Deliberately its own job — the only one in this workflow with
    # id-token/attestations write, so auditing "what can sign a release"
    # means reading this one job, not cross-referencing several.
    needs: [prepare, create-manifest]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write # push the signature/attestation alongside the image
      id-token: write # mint the OIDC token cosign and the attest actions use
      attestations: write
      artifact-metadata: write # required by actions/attest for the artifact storage record
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolved
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_BRANCH_TAG: ${{ needs.prepare.outputs.branch_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${PREP_REPO_OWNER}/${PREP_REPO_NAME}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${PREP_BRANCH_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: |
          docker run --rm -v "$PWD:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favor of actions/attest (same
        # inputs) — confirmed via a real run of this exact job before this
        # rename, which also surfaced the deprecation warning below.
        #
        # create-storage-record: false — verified via a real run that the
        # default (true) fails here with "no artifacts found": the storage
        # record feature expects a GitHub Actions build artifact (uploaded
        # via actions/upload-artifact) to correlate with, which a pure
        # container-image subject never has. The attest-build-provenance
        # step below hits the same subject and succeeds at it, so this is
        # specific to SBOM-mode subject resolution, not a permissions gap —
        # the SBOM attestation itself still pushes to the registry fine
        # either way, this only turns off the (currently broken) sidebar
        # summary indexing.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          push-to-registry: true
