name: E2E Tests

on:
  push:
    branches: [main]
    # Only paths baked into (or exercising) the AIO image — this is the
    # heaviest workflow in the repo; a docs or workflow-file merge must not
    # trigger an image build plus a Playwright matrix.
    paths:
      - 'apps/**'
      - 'core/**'
      - 'dispatcharr/**'
      - 'frontend/**'
      - 'docker/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'e2e-upstream/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'version.py'
      - 'manage.py'
      - '.github/workflows/e2e-tests.yml'
  # No `paths:` filter here, deliberately. The Main ruleset requires the
  # pristine/seeded/streaming checks on every PR; a path-filtered workflow
  # that never triggers leaves them "Expected" forever and blocks the merge.
  # A job that runs and *skips* satisfies a required check, so the workflow
  # always triggers and the `changes` job below decides whether the heavy
  # jobs actually run — a docs-only PR costs one ~10s job, not an image
  # build plus a Playwright matrix.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reimplements the push trigger's paths filter for pull requests, so the
  # required checks always report (skipped counts as passing) without the
  # suite always running. Keep the pattern below in lockstep with the push
  # `paths:` list above.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # pull_request checks out the merge commit, whose first parent is
          # the base branch tip — depth 2 is enough to diff the whole PR.
          fetch-depth: 2

      - name: Decide whether the E2E suite needs to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          pattern='^(apps/|core/|dispatcharr/|frontend/|docker/|scripts/|e2e/|e2e-upstream/|pyproject\.toml$|uv\.lock$|version\.py$|manage\.py$|\.github/workflows/e2e-tests\.yml$)'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build AIO image
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # A wedged docker build otherwise burns the 6-hour default.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The provider builds in seconds; the AIO image takes minutes. Building
      # it first means a broken e2e-upstream/Dockerfile — or a make-asset.sh
      # failure, its ffmpeg being deliberately unpinned — fails this job
      # immediately instead of after the AIO build has finished. Same
      # rationale as the `upstream` job below having no `needs: build`.
      - name: Build the upstream provider image
        run: docker build -f e2e-upstream/Dockerfile -t dispatcharr-e2e-upstream:local e2e-upstream

      # One build for all three consumers. docker/Dockerfile:14 uses
      # `npm install` with no lockfile, so N builds can produce N different
      # frontend bundles; building once means one artifact under test.
      - name: Build the image
        run: docker build -f docker/Dockerfile -t dispatcharr-e2e:local .

      # docker save accepts several image references and writes one archive,
      # so the artifact plumbing and the three test-job consumers below are
      # unchanged — docker load restores both tags.
      - name: Export both images
        run: docker save dispatcharr-e2e:local dispatcharr-e2e-upstream:local | gzip > /tmp/dispatcharr-e2e.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dispatcharr-e2e-image
          path: /tmp/dispatcharr-e2e.tar.gz
          retention-days: 1

  # A sibling of build, deliberately without needs: build — it tests the
  # provider in isolation, so a provider regression reports in under a
  # minute rather than after the AIO image's 45-minute budget.
  upstream:
    name: upstream
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./e2e-upstream
        run: npm ci

      - name: Typecheck
        working-directory: ./e2e-upstream
        run: npm run typecheck

      - name: Run the provider test suite
        working-directory: ./e2e-upstream
        run: npm test

  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    # Comfortably over the streaming project's 300s per-test timeout, and far
    # under the 6-hour default a container that never becomes ready would take.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [pristine, seeded, streaming, streaming-failover, streaming-greybox]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dispatcharr-e2e-image
          path: /tmp

      - name: Load the image
        run: docker load < /tmp/dispatcharr-e2e.tar.gz

      # The same script developers run, not a second copy of its boot path.
      # This step used to duplicate scripts/e2e_up.sh's `docker run` and
      # readiness loop almost verbatim — same image, volume, env and port
      # binding — and the two had already drifted, which is the argument for
      # calling it: a change to how the container boots can no longer be made
      # in one place and forgotten in the other.
      #
      # The AIO image does not rebuild here: the script's `docker image
      # inspect` short-circuit sees the image loaded above, under the tag it
      # defaults to. Its defaults are exactly what this job used — container
      # dispatcharr-e2e, volume dispatcharr-e2e-data, image
      # dispatcharr-e2e:local, port 9191 — so nothing needs overriding.
      #
      # The provider image is different: scripts/e2e_up.sh rebuilds it
      # unconditionally by default, which here would silently discard the
      # artifact `build` already produced and loaded above — one build
      # feeding every consumer is the same guarantee the AIO image gets from
      # being build-if-absent, and ffmpeg being deliberately unpinned means a
      # second build here is not guaranteed to carry the same asset.
      # DISPATCHARR_E2E_SKIP_UPSTREAM_BUILD below opts the script out of that
      # rebuild so the loaded artifact is what actually runs.
      #
      # Each project gets its own container. pristine in particular needs an
      # instance with no superuser, which the bootstrap project consumes.
      #
      # Published on 127.0.0.1 only, which the script enforces: once bootstrap
      # has run, this container holds a superuser whose password is committed
      # to this repository. Every consumer — the script's readiness curl and
      # Playwright's E2E_BASE_URL — runs on this same runner, and
      # ubuntu-latest resolves `localhost` to 127.0.0.1.
      - name: Run the container and wait for it to be ready
        env:
          # 120 polls at 5s = 600s, the budget this job's hand-rolled loop had
          # (60 × 10s). The script's own default of 300s suits a laptop with a
          # warm volume rather than a cold runner.
          DISPATCHARR_E2E_READY_ATTEMPTS: '120'
          DISPATCHARR_E2E_SKIP_UPSTREAM_BUILD: '1'
        run: ./scripts/e2e_up.sh

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: ./e2e
        run: npm run typecheck

      - name: Run E2E tests
        working-directory: ./e2e
        env:
          E2E_BASE_URL: http://localhost:9191
        run: npx playwright test --project=${{ matrix.project }}

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker logs dispatcharr-e2e || true
          docker logs e2e-upstream || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the container
        if: always()
        run: docker rm -f dispatcharr-e2e || true

  # The single check the Main ruleset requires. Matrix jobs can't be required
  # directly: when `changes` gates the suite off, the matrix is skipped before
  # expansion, so no check named pristine/seeded/streaming ever reports and a
  # required check that never reports blocks the merge forever. This job runs
  # unconditionally (`if: always()`), so it always reports, and it passes only
  # when everything it depends on succeeded or was deliberately skipped.
  e2e-result:
    name: E2E result
    runs-on: ubuntu-latest
    needs: [changes, upstream, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify the E2E outcome
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes=$CHANGES_RESULT upstream=$UPSTREAM_RESULT test=$TEST_RESULT e2e-required=$E2E_REQUIRED"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection itself failed — cannot prove the suite was unnecessary."
            exit 1
          fi
          if [ "$E2E_REQUIRED" != "true" ]; then
            echo "No E2E-relevant paths changed; suite deliberately skipped."
            exit 0
          fi
          if [ "$UPSTREAM_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "E2E suite was required and did not fully succeed."
            exit 1
          fi
          echo "E2E suite passed."
