name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild against whatever base-image.yml published most
    # recently (see the "Resolve base image digest" step below), so the app
    # image picks up base-layer OS patches even on a week nothing in this
    # repo changed. Runs a few hours after base-image.yml's own schedule.
    - cron: '0 8 * * 0' # Sunday 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # compute a single timestamp, version, and repo metadata for the entire workflow
    outputs:
      repo_owner: ${{ steps.meta.outputs.repo_owner }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
      branch_tag: ${{ steps.meta.outputs.branch_tag }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      base_image: ${{ steps.base.outputs.image }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # Needed for "Resolve base image digest" below (docker buildx
        # imagetools inspect) — this job otherwise never touches Docker.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate timestamp for build
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Extract version info
        id: version
        run: |
          VERSION=$(python -c "import version; print(version.__version__)")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set repository and image metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          PR_HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          REPO_OWNER=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

          REPO_NAME=$(echo "${REPOSITORY}" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT

          if [[ "${REF}" == "refs/heads/main" ]]; then
            echo "branch_tag=latest" >> $GITHUB_OUTPUT
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${REF}" | sed 's/refs\/heads\///' | sed 's/[^a-zA-Z0-9]/-/g')
            echo "branch_tag=${BRANCH}" >> $GITHUB_OUTPUT
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${PR_HEAD_IS_FORK}" == "true" ]]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve base image digest
        # Resolved exactly once, here in `prepare`, not inside the matrix
        # job below: the matrix runs amd64 and arm64 as separate jobs on
        # separate runners that can start minutes apart, so resolving
        # per-leg (the previous version of this step) could let ":base"
        # move between them and hand each arch a different base — the
        # opposite of what this step exists to guarantee. Every matrix leg
        # now reads the same needs.prepare.outputs.base_image.
        id: base
        env:
          REPO_OWNER: ${{ steps.meta.outputs.repo_owner }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${REPO_NAME}:base" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=ghcr.io/${REPO_OWNER}/${REPO_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  docker:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # no per-job outputs here; shared metadata comes from the `prepare` job
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Check if commit is from GitHub Actions
        id: check_actor
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "${ACTOR}" == "github-actions" ]]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.repo_name }}
            org.opencontainers.image.description=Your ultimate IPTV & stream Management companion.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.timestamp }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=See repository
            org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/
            org.opencontainers.image.vendor=${{ needs.prepare.outputs.repo_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            maintainer=${{ github.actor }}
            build_version=Dispatcharr version: ${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.timestamp }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Build only the platform for this matrix job to avoid running amd64
          # stages under qemu on an arm64 runner (and vice-versa). This makes
          # the matrix runner's platform the one built by buildx.
          platforms: linux/${{ matrix.platform }}
          # push arch-specific tags from each matrix job (they will be combined
          # into a multi-arch manifest in a follow-up job)
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.branch_tag }}-${{ matrix.platform }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.timestamp }}-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
            TIMESTAMP=${{ needs.prepare.outputs.timestamp }}
          file: ./docker/Dockerfile

  create-manifest:
    # wait for prepare and all matrix builds to finish
    needs: [prepare, docker]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest tags
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_BRANCH_TAG: ${{ needs.prepare.outputs.branch_tag }}
          PREP_VERSION: ${{ needs.prepare.outputs.version }}
          PREP_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OWNER=${PREP_REPO_OWNER}
          REPO=${PREP_REPO_NAME}
          BRANCH_TAG=${PREP_BRANCH_TAG}
          VERSION=${PREP_VERSION}
          TIMESTAMP=${PREP_TIMESTAMP}

          echo "Creating multi-arch manifest for ${OWNER}/${REPO}"

          # ghcr.io: both the branch tag (e.g. latest) and the version+timestamp tag
          # point to the same manifest by using multiple --tag flags in one call,
          # which prevents orphaned untagged images on each new build
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PREP_REPO_NAME}" \
            --annotation "index:org.opencontainers.image.description=Your ultimate IPTV & stream Management companion." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}-${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.licenses=See repository" \
            --annotation "index:org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/" \
            --annotation "index:org.opencontainers.image.vendor=${OWNER}" \
            --annotation "index:org.opencontainers.image.authors=${ACTOR}" \
            --annotation "index:maintainer=${ACTOR}" \
            --annotation "index:build_version=Dispatcharr version: ${VERSION}-${TIMESTAMP}" \
            --tag ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG} \
            --tag ghcr.io/${OWNER}/${REPO}:${VERSION}-${TIMESTAMP} \
            ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-amd64 ghcr.io/${OWNER}/${REPO}:${BRANCH_TAG}-arm64

  sign-and-attest:
    # Deliberately its own job, not folded into create-manifest: this is the
    # only job in the whole pipeline with id-token/attestations write, so
    # anyone auditing "what can sign a release" only has to read this one
    # job rather than cross-reference which of several jobs happens to carry
    # those scopes.
    needs: [prepare, create-manifest]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write # push the signature/attestation alongside the image
      id-token: write # mint the OIDC token cosign and the attest actions use
      attestations: write
      artifact-metadata: write # required by actions/attest for the artifact storage record
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolved
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_BRANCH_TAG: ${{ needs.prepare.outputs.branch_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${PREP_REPO_OWNER}/${PREP_REPO_NAME}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${PREP_BRANCH_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: |
          # anchore/syft v1.51.0
          docker run --rm -v "$PWD:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favor of actions/attest (same
        # inputs) — confirmed via a real run of this exact job before this
        # rename, which also surfaced the deprecation warning below.
        #
        # create-storage-record: false — verified via a real run that the
        # default (true) fails here with "no artifacts found": the storage
        # record feature expects a GitHub Actions build artifact (uploaded
        # via actions/upload-artifact) to correlate with, which a pure
        # container-image subject never has. The attest-build-provenance
        # step below hits the same subject and succeeds at it, so this is
        # specific to SBOM-mode subject resolution, not a permissions gap —
        # the SBOM attestation itself still pushes to the registry fine
        # either way, this only turns off the (currently broken) sidebar
        # summary indexing.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          push-to-registry: true
