name: CodeQL (Actions)

# Static analysis of this repo's own GitHub Actions workflows, using CodeQL's
# "actions" language pack — the same static-analysis discipline already
# applied to Python/JS app code, extended to the CI definitions that can
# push to production.
#
# No pull_request trigger, deliberately: SARIF upload needs
# security-events: write, which GITHUB_TOKEN does not carry on a PR from a
# fork (see actions-lint.yml for the same constraint on zizmor). This repo's
# own PRs are same-repo branches, not fork PRs, so push/schedule/dispatch
# cover the real usage pattern without ever hitting that gap.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
