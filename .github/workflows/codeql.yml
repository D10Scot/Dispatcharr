name: CodeQL (Actions)

# Static analysis of this repo's own GitHub Actions workflows, using CodeQL's
# "actions" language pack — the same static-analysis discipline already
# applied to Python/JS app code, extended to the CI definitions that can
# push to production.
#
# No pull_request trigger, deliberately. The usual reason to avoid one
# (SARIF upload needs security-events: write, which a fork PR's
# GITHUB_TOKEN doesn't carry — see actions-lint.yml's zizmor comment)
# doesn't actually bind here: this repo's PRs are same-repo branches, so
# they get that permission fine. The real tradeoff, stated plainly: CodeQL
# never gates a PR, findings only surface after landing on main via the
# push/schedule/dispatch triggers below. Acceptable for a single-maintainer
# fork; revisit if that changes.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:actions"
