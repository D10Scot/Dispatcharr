name: Backend Tests

# Always triggers, and gates internally — the same shape as e2e-tests.yml and
# lifecycle-tests.yml, and for the same reason. `Backend result` at the bottom
# of this file is the aggregate that can be required on every PR; the `test`
# matrix jobs cannot be. When `plan` selects no labels the matrix is skipped
# *before expansion*, so no check named `apps.channels.tests` ever reports at
# all, and a path-filtered workflow that never triggers leaves such a required
# check "Expected" forever and blocks the merge. A job that runs and *skips*
# satisfies it. So neither trigger carries a `paths:` filter — the `plan` job
# below is the change detector, and it already derives its labels from the
# diff, yielding `[]` (and `has_tests=false`) for a diff touching no backend
# path. Cost on a docs-only PR is one `plan` job, not a test matrix.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the full backend test suite
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan test groups
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      has_tests: ${{ steps.resolve.outputs.has_tests }}
      base_image: ${{ steps.base_image.outputs.image }}
      sync_python_deps: ${{ steps.base_image.outputs.sync_python_deps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Collect changed paths
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ inputs.full_suite }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : > /tmp/changed_paths.txt

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FULL_SUITE" = "true" ]; then
              : > /tmp/changed_paths.txt
              echo "mode=full" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only HEAD~1 HEAD > /tmp/changed_paths.txt || true
              echo "mode=diff" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed_paths.txt
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          else
            if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > /tmp/changed_paths.txt
              echo "mode=initial-push" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only "$EVENT_BEFORE" "$HEAD_SHA" > /tmp/changed_paths.txt
              echo "mode=push" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Select base image
        id: base_image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # base-image.yml only ever publishes one tag now: `base`, built from
          # main. This fork has no dev branch, so there's no second tag to
          # select between.
          REPO_OWNER="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_OWNER}/${REPO_NAME}:base"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if grep -qx 'pyproject.toml' /tmp/changed_paths.txt || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sync_python_deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync_python_deps=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Using base image: ${IMAGE}"

      - name: Resolve Django test labels
        id: resolve
        env:
          FULL_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          LABELS=$(python scripts/ci_backend_test_labels.py < /tmp/changed_paths.txt)
          echo "labels=${LABELS}" >> "$GITHUB_OUTPUT"
          if [ "${LABELS}" = "[]" ]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected labels: ${LABELS}"

  test:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    container:
      # This is this repository's own base image, rebuilt by base-image.yml on
      # every push to main and selected as `:base` in the plan job.
      # A digest pin cannot apply to a deliberately floating own-built tag, and
      # resolving the digest at runtime in this same job would trust the same
      # registry response the tag already does — no integrity gained.
      image: ${{ needs.plan.outputs.base_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --entrypoint ""
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        label: ${{ fromJSON(needs.plan.outputs.labels) }}
    env:
      DISPATCHARR_ENV: aio
      DJANGO_SECRET_KEY: ci-test-secret-key
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: secret
      DISPATCHARR_LOG_LEVEL: WARNING
      SYNC_PYTHON_DEPS: ${{ needs.plan.outputs.sync_python_deps }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run tests in base image
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TEST_LABEL: ${{ matrix.label }}
        run: bash scripts/ci_bootstrap_backend.sh "$TEST_LABEL" -v2

  # Gate 2 (Phase 2 spec, Stage 2a). One Django test label per container -- the shape
  # the `test` matrix above already uses, and the shape stage 2a's isolation probe
  # measured. The labels are hard-coded rather than taken from plan.outputs.labels
  # BECAUSE that list is diff-gated: a PR touching only apps/epg/ would measure a
  # different label set and the floor would compare quantities that are not comparable.
  # See docs/superpowers/plans/2026-09-10-phase2-2a7-coverage-gate.md, Task 6.
  coverage-label:
    name: Coverage ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        label: [apps.proxy.tests, apps.proxy.live_proxy.tests, apps.channels.tests]
    container:
      image: ${{ needs.plan.outputs.base_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --entrypoint ""
    env:
      DISPATCHARR_ENV: aio
      DJANGO_SECRET_KEY: ci-test-secret-key
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: secret
      DISPATCHARR_LOG_LEVEL: WARNING
      # metrics.yml sets this for the same reason: it picks up `coverage` and
      # `hypothesis` from uv.lock before the base image is next rebuilt. Both are in
      # pyproject.toml's MAIN dependency list, not a dev group, precisely because CI
      # installs with --no-dev (pyproject.toml:41-45).
      SYNC_PYTHON_DEPS: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify the measurement can be trusted
        # Explicit shell: needed here and is NOT redundant. A run: block inside a
        # container: job defaults to sh (dash), not bash, and dash's `set` has no
        # `-o pipefail` -- every set -euo pipefail step below the same trap, WITHOUT
        # this line, dies on its own first line with "Illegal option -o pipefail"
        # (exit 2, not the ModuleNotFoundError's exit 1 this step is checking for) --
        # a two-line failure that reads like it's about Python and is not. The other
        # set -euo pipefail steps in this file are fine for two DIFFERENT reasons,
        # neither of which generalises to a new step: the `test` job's one run step
        # invokes `bash scripts/...` directly rather than relying on the block's own
        # shell, and the `plan` job carries no container: at all, so it gets bash for
        # free on a bare ubuntu-latest runner. A new container-job step needs its own
        # shell: bash, every time.
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/dispatcharrpy/bin:$PATH"
          # An import failure here does not fail a label loudly -- it fails two test
          # modules, the label reports errors, and ~61 statements they would have
          # covered are silently counted as missed, moving the number the way a
          # regression moves.
          python -c "import coverage, hypothesis; print(coverage.__version__, hypothesis.__version__)"

      - name: Measure one label
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          COVERAGE_LIVE_PATH_DATA_DIR: /tmp/gate-data
          CI_BACKEND_RUNNER: bash scripts/coverage_live_path.sh --label ${{ matrix.label }}
        run: bash scripts/ci_bootstrap_backend.sh

      - name: Upload this label's coverage data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-data-${{ matrix.label }}
          path: /tmp/gate-data
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: Coverage gate
    needs: [plan, coverage-label]
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.plan.outputs.base_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --entrypoint ""
    env:
      SYNC_PYTHON_DEPS: 'true'
    steps:
      - name: Install git
        # The base image ships no git, so actions/checkout falls back to a tarball with
        # no .git/ and the floor comparison below cannot fetch the base ref. Unversioned
        # apt is the base image's own convention (CLAUDE.md, build reproducibility).
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download every label's coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gate-data-*
          path: /tmp/gate-parts

      - name: Compare against the floor
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/dispatcharrpy/bin:$PATH"
          bash scripts/coverage_live_path.sh --gate /tmp/gate-parts

      - name: Refuse a floor edited downward
        if: always()
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # `missing` is a MAXIMUM and lower is better, so a RAISED value is the
          # regression. Read that twice; the polarity is the opposite of a percentage's.
          #
          # This container: job runs as root against a checkout owned by a different
          # uid, and a RAW git invocation does not inherit the safe.directory exception
          # actions/checkout quietly sets up for its own use -- only actions/checkout
          # itself is covered. Any later step in a container: job that calls git
          # directly (this one; not "Compare against the floor" above, which never
          # touches git) needs its own safe.directory line, or git refuses everything
          # with "detected dubious ownership" before it runs a single real command.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin "$BASE_REF"
          # Two questions, asked separately on purpose. `git show <ref>:<path>`
          # fails identically whether the base ref is unreachable and whether the
          # path is simply absent from it, and only the second is the bootstrap
          # case this guard may forgive. Collapsing them lets a broken fetch, a
          # renamed floor or a lost safe.directory exception report "nothing to
          # compare" and pass green forever, with the floor unprotected and the
          # check still reporting success -- a guard that cannot LOOK is not a
          # guard that found nothing.
          #
          # FETCH_HEAD, not origin/$BASE_REF: the fetch above prints only
          # "-> FETCH_HEAD", and whether it also moves the remote-tracking ref
          # depends on the refspec actions/checkout left behind. FETCH_HEAD is
          # unambiguously what was just fetched.
          BASE=$(git rev-parse --verify FETCH_HEAD)   # can I look? failing here is a real error
          # `--verify --quiet` is git's own "does this object exist" form: it
          # exits non-zero and prints nothing when the path is not in the tree.
          # That is an answer, not a discarded error message -- $BASE was verified
          # above, so absence here can only mean the path.
          OLD_BLOB=$(git rev-parse --verify --quiet "${BASE}:scripts/coverage_live_path.floor") || true
          if [ -z "$OLD_BLOB" ]; then
            echo "no floor on ${BASE_REF} (${BASE}); nothing to compare"
            echo "Expected exactly once, on the PR that introduces the floor."
            exit 0
          fi
          OLD=$(git cat-file blob "$OLD_BLOB" | grep -E '^missing=' | cut -d= -f2)
          NEW=$(grep -E '^missing=' scripts/coverage_live_path.floor | cut -d= -f2)
          echo "floor: base=$OLD head=$NEW"
          if [ "$NEW" -gt "$OLD" ]; then
            echo "The floor was raised ($OLD -> $NEW): more missed statements are now permitted."
            echo "A floor may rise only in a PR that earns and explains the rise."
            exit 1
          fi

  # The one check in this workflow that may be required. It always reports,
  # because it is not gated on anything — see the comment on the triggers.
  #
  # `needs.test.result` is the matrix job's aggregate: `success` only if every
  # shard passed, `failure` if any shard failed, and `skipped` when the job's
  # `if` was false — which is exactly the "no backend paths changed" case, and
  # the only case in which a skip is legitimate. Branch 3 below therefore
  # demands `success` and nothing else: a skipped matrix on a run that DID
  # select labels means the shards never ran, and must not report green.
  #
  # Gate 2's coverage-gate job is folded into the same three-branch logic: a
  # docs-only PR skips test, coverage-label and coverage-gate together
  # (has_tests=false), legitimately; otherwise coverage-gate must also be
  # exactly `success`, alongside test.
  backend-result:
    name: Backend result
    runs-on: ubuntu-latest
    needs: [plan, test, coverage-gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify the backend test outcome
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GATE_RESULT: ${{ needs.coverage-gate.result }}
          TESTS_REQUIRED: ${{ needs.plan.outputs.has_tests }}
        run: |
          echo "plan=$PLAN_RESULT test=$TEST_RESULT gate=$GATE_RESULT tests-required=$TESTS_REQUIRED"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "Test planning itself failed — cannot prove the suite was unnecessary."
            exit 1
          fi
          if [ "$TESTS_REQUIRED" != "true" ]; then
            echo "No backend-relevant paths changed; suite deliberately skipped."
            exit 0
          fi
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Backend suite was required and did not fully succeed."
            exit 1
          fi
          if [ "$GATE_RESULT" != "success" ]; then
            echo "Coverage gate was required and did not succeed."
            exit 1
          fi
          echo "Backend suite passed."
