name: Lint

# Static analysis that isn't zizmor (see actions-lint.yml): workflow syntax
# (actionlint), Dockerfile anti-patterns (hadolint), committed secrets
# (gitleaks, full history), and uv.lock freshness against pyproject.toml.
#
# Every tool below runs as a digest-pinned container rather than a
# marketplace action — the same reasoning the supply-chain checklist applies
# to vulnerability scanners: the thing auditing this repo's supply chain
# shouldn't have an unpinned supply chain of its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: actionlint
        # shellcheck/pyflakes integrations disabled: they audit `run:` shell
        # quality, a different concern from actionlint's own workflow-syntax
        # checks, and would fail immediately on pre-existing debt across
        # every workflow file. Generated *.lock.yml files are excluded here:
        # gh-aw emits fields newer than this pinned actionlint release.
        run: |
          workflow_files=$(find .github/workflows -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "*.lock.yml" ! -name "*.lock.yaml")
          # rhysd/actionlint v1.7.12
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color -shellcheck= -pyflakes= $workflow_files

  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [docker/Dockerfile, docker/DispatcharrBase, e2e-upstream/Dockerfile]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: hadolint
        # --failure-threshold error: only true errors block. The warnings
        # DispatcharrBase currently has (DL3008 unpinned apt versions,
        # DL4006 missing `set -o pipefail`, DL3003/DL3015) are pre-existing,
        # and DL3008 specifically is in tension with "OS patches applied at
        # build time" (see docker/DispatcharrBase) — pinning apt package
        # versions is what that control deliberately avoids.
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          # hadolint/hadolint v2.15.1
          docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold error - < "$DOCKERFILE"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks (full history)
        # .gitleaks.toml allowlists one confirmed false positive (a vendored,
        # minified third-party JS bundle) with the reason recorded inline —
        # do not broaden it to silence a real finding.
        run: |
          # zricethezav/gitleaks v8.30.1
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml -v --redact --exit-code=1

  credential-logging:
    name: credential logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The check diffs against the PR base (or the previous commit on a
          # push), so it needs history rather than the default shallow clone.
          fetch-depth: 0

      - name: check changed Python files
        # Mirrors the PostToolUse hook in .claude/hooks/run-affected-tests.sh,
        # which runs the same script on the file just edited. Only *changed*
        # files are checked: the pattern still flags pre-existing log calls
        # elsewhere in the tree, and this job is a ratchet, not a backlog.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A pull request diffs against its base. A push diffs against the
          # commit the branch was at before it, so a multi-commit push is
          # checked whole rather than only its tip; github.event.before is all
          # zeros for a new branch (and absent outside push), so fall back.
          if [ -n "${PR_BASE_SHA:-}" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "${PUSH_BEFORE_SHA//0/}" != "" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="HEAD^"
          fi
          # Collected into the positional parameters rather than with mapfile,
          # so the same snippet can be run locally on a bash 3.2 (macOS) shell.
          set --
          while IFS= read -r changed; do
            [ -n "$changed" ] && set -- "$@" "$changed"
          done < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py')
          if [ "$#" -eq 0 ]; then
            echo "No Python files changed against ${base}."
            exit 0
          fi
          echo "Checking $# changed Python file(s):"
          printf '  %s\n' "$@"
          python3 ./scripts/check_credential_logging.py "$@"

  lockfile-fresh:
    name: uv.lock freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: uv lock --check
        # The plain (distroless) uv:0.12.5 image has no system libc it can
        # introspect to auto-download a managed Python, so `uv lock` fails
        # outright inside it — use the python3.13-trixie-slim variant, which
        # is what was actually verified to work locally before this went in.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/astral-sh/uv:0.12.5-python3.13-trixie-slim@sha256:d1e005e6f5aac724b7554db95f1c128a77d8d35b59ebe70e188852b4bdad3a3d \
            uv lock --check
