name: Go Tests

# Always triggers, and gates internally — the same shape as
# frontend-tests.yml, backend-tests.yml, e2e-tests.yml and
# lifecycle-tests.yml, and for the same reason. `Go result` at the bottom is
# the aggregate that can be required on every PR; `build` and `lint` cannot
# be, because a gated job that skips still reports, but a path-filtered
# workflow that never triggers reports nothing at all, leaving a required
# check "Expected" forever and blocking the merge.
#
# The coverage ratchet IS here, as of 2c-9: `build` measures (one `go test
# -race` run, now with -coverprofile) and `coverage` gates against
# scripts/coverage_relay_go.floor on a bare runner, both in `Go result`'s
# needs below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      base_image: ${{ steps.base_image.outputs.image }}
    steps:
      # The `if:` is always true under this workflow's three triggers, and it
      # is copied deliberately rather than simplified: frontend-tests.yml,
      # e2e-tests.yml and lifecycle-tests.yml all carry the identical line,
      # so it is the house spelling of this job, and a fourth workflow that
      # differs invites the reader to wonder which one is wrong. If the
      # triggers ever grow a `schedule:`, it starts doing work.
      - name: Checkout code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pull_request checks out the merge commit, whose first parent is
          # the base branch tip — depth 2 is enough to diff the whole PR. A
          # push diffs github.event.before against the new head instead, and
          # that commit is at an unknown depth, so it needs full history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      # The same own-built image backend-tests.yml's `plan` job selects
      # (base-image.yml, built from docker/DispatcharrBase): it ships the
      # production ffmpeg (8.1.2), which the `build` job's container: now
      # uses so parity-matrix row 4's real-ffmpeg pin runs against the
      # version production and the harness capture actually use, not
      # whatever a bare ubuntu-latest runner's apt carries.
      - name: Select base image
        id: base_image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          REPO_OWNER="$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_OWNER}/${REPO_NAME}:base"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Using base image: ${IMAGE}"

      - name: Decide whether the Go jobs need to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            if [ "$EVENT_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit to diff against; running the Go jobs."
              echo "go=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! changed=$(git diff --name-only "$EVENT_BEFORE" "$HEAD_SHA"); then
              echo "Could not diff the pushed range; running the Go jobs."
              echo "go=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          printf 'Changed files:\n%s\n' "$changed"
          # Deliberately does NOT match docker/Dockerfile (the relay-builder
          # stage included): these jobs run `go build`/`go vet`/`go test
          # -race`/golangci-lint directly against the module on the runner,
          # never through a Docker build, so a Dockerfile-only change has
          # nothing here to verify. docker-build.yml would catch a broken
          # relay-builder stage, but only for a Dockerfile change and only
          # AFTER merge -- it triggers on push to main, not on PRs.
          # scripts/coverage_relay_go.* is here and NOT under the Python
          # gate's scripts/coverage_live_path prefix, deliberately: that
          # prefix is a _PATH_ALIASES entry in dispatcharr/test_discovery.py
          # that routes to three DJANGO labels, so a file named
          # coverage_live_path_go.sh would have run the Python backend suite
          # for a Go-only change.
          pattern='^(relay/|\.golangci\.yml$|scripts/check_go_stdlib_only\.sh$|scripts/check_go_credential_logging\.sh$|scripts/coverage_relay_go\.|\.github/workflows/go-tests\.yml$|apps/proxy/live_proxy/tests/harness/fixtures/ffmpeg_stderr/)'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # Runs inside this repository's own base image (the same one
    # backend-tests.yml's `test`/`coverage-label` jobs use), NOT a bare
    # ubuntu-latest runner: parity-matrix row 4's one real-ffmpeg pin
    # (relay/channel/source_transcode_real_test.go) must run against the
    # product's OWN ffmpeg (8.1.2, docker/DispatcharrBase), not merely
    # "any" ffmpeg. A stream-copy progress line's leading token differs by
    # major version -- `frame=` from 7.x on, `size=` on 6.x -- and both
    # relays' progress gate looks for `frame=` verbatim
    # (input/manager.py:1017; ffmpeg/progress.go:40), so ffmpeg 6.x is
    # blind to every progress line, not just quantitatively different, and
    # row 4's detector can never arm against it: a plain `apt-get install
    # ffmpeg` on ubuntu-latest resolved to 6.1.1 and reddened this row in
    # CI while every local and 8.1.2 run stayed green. Filed as #299
    # (2026-09-14 CI fix round; spec Amendment A4.7, Done log). Do not
    # widen the parser or this test to accommodate 6.x -- #299 owns that.
    container:
      image: ${{ needs.changes.outputs.base_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --init: GitHub starts a job container with a keep-alive PID 1 (a
      # `tail -f /dev/null` shape) and docker-execs each step into it, and
      # that PID 1 never reaps anything -- TestAChildOfADeadRelayDiesWithIt
      # (relay/ffmpeg/spawn_linux_test.go) kills a stand-in with Pdeathsig,
      # which works, but the now-dead process sits as an unreaped zombie
      # until the test's 5s deadline, because nothing calls wait() on it.
      # docker-init (added by --init) becomes PID 1 instead and reaps on
      # exit, the same fix ffmpeg/procgone_test.go's processGone also
      # carries a Linux-only zombie check for, independently.
      options: --entrypoint "" --init
    defaults:
      run:
        working-directory: ./relay
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod rather than pinned here, so the toolchain has
          # exactly one source of truth and CI cannot drift from the
          # Dockerfile's builder stage without go.mod moving too.
          go-version-file: relay/go.mod

      - name: ffmpeg version
        run: ffmpeg -version | head -1

      - name: Build
        run: go build ./...

      # Both GOOS, durably: relay/ffmpeg/spawn_linux.go and spawn_other.go
      # are build-tag-split, and this job's native GOOS is linux (the
      # container runs on the ubuntu-latest host), so a plain `go vet ./...`
      # alone never typechecks spawn_other.go's darwin/!linux branch -- the
      # exact gap golangci-lint hit in the CI fix round's item 1 (its darwin
      # counterpart never having compiled spawn_linux_test.go). GOOS=linux
      # is redundant with the native pass on this runner; kept anyway so
      # this step and the lint job's below read the same, deliberately.
      - name: Vet
        run: |
          go vet ./...
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...

      # -race links a runtime that needs cgo, and the base image is a
      # runtime image (docker/DispatcharrBase's `final` stage) with no C
      # toolchain -- confirmed in CI on cd29df98: "go: -race requires cgo;
      # enable cgo by setting CGO_ENABLED=1" immediately, before any test
      # ran. Root in the container (no sudo needed); unversioned apt matches
      # the base image's own accepted practice.
      - name: Install a C toolchain for -race
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev

      # -race is not optional: the concurrency model changes from
      # gevent-cooperative to OS-thread-parallel goroutines in this phase, so
      # a data race the Python implementation made structurally impossible
      # becomes possible for the first time (spec § Testing).
      #
      # ONE run, not two. --measure IS `go test -count=1 -race
      # -covermode=atomic -coverprofile=... ./...`, so adding the ratchet adds
      # a profile, not a second pass over a 90-second suite. It exits non-zero
      # and DELETES the profile when any package fails, so the `coverage` job
      # below can never gate on a partial measurement.
      - name: Test with the race detector, and measure coverage
        working-directory: .
        run: bash scripts/coverage_relay_go.sh --measure /tmp/relay-go-coverage

      # The profile and the linked-package list travel to the `coverage` job,
      # which needs neither Go nor this container to read them.
      - name: Upload the coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-go-coverage
          path: /tmp/relay-go-coverage
          retention-days: 1

      - name: Assert the module is standard-library only
        working-directory: .
        run: scripts/check_go_stdlib_only.sh relay

      # The Go side of the credential-logging rule (lint.yml's
      # credential-logging job is the Python side): every error-typed
      # argument to a formatting or logging call passes through
      # redact.Error or carries a written reason. relay/internal/credlint
      # states the rule; the PostToolUse hook runs the same script.
      - name: Assert no error reaches a log unredacted
        working-directory: .
        run: scripts/check_go_credential_logging.sh relay

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod

      # Three invocations, deliberately, not one: this runner's native GOOS
      # is linux, so a bare run only ever typechecks relay/ffmpeg/
      # spawn_linux.go, never spawn_other.go's darwin/!linux build tag, and
      # a Mac contributor's local run is the mirror opposite. CI fix round
      # item 1 hit exactly this gap (darwin's local lint never compiling
      # spawn_linux_test.go, so its unused-parameter finding was invisible
      # until ubuntu's CI run). Zero findings on all three is the ratchet;
      # .claude/hooks/run-go-checks.sh runs the same three passes locally.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned deliberately, the same rule as zizmor's version in
          # actions-lint.yml: a new release adding a linter must not fail an
          # unrelated PR. Keep in sync with the version the PostToolUse hook
          # checks for (.claude/hooks/run-go-checks.sh).
          version: v2.13.2
          working-directory: relay

      - name: Run golangci-lint (GOOS=linux)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: linux
        with:
          version: v2.13.2
          working-directory: relay

      - name: Run golangci-lint (GOOS=darwin)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: darwin
        with:
          version: v2.13.2
          working-directory: relay

  # Gate 2's Go counterpart (spec § Stage 2c, the 2c-9 row; § Testing). A bare
  # runner, deliberately: the gate parses the profile with awk and compares
  # hashes, so it needs no Go toolchain and no base image — and it needs git
  # and a full history, which this repo's base image does not ship (see
  # backend-tests.yml's coverage-gate, which installs git for exactly this).
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the coverage profile
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-go-coverage
          path: /tmp/relay-go-coverage

      - name: Compare against the floor
        run: bash scripts/coverage_relay_go.sh --gate /tmp/relay-go-coverage

      # Two questions, asked separately, in backend-tests.yml's idiom and for
      # its reason. A floor that is RAISED permits more missed statements; a
      # floor that is DELETED turns --gate's documented bootstrap branch ("no
      # floor, this run is a census draw") into a permanent off switch. The
      # base ref is what tells the two apart from the legitimate one-time
      # absence on the PR that introduces the floor.
      - name: Refuse a floor edited downward or deleted
        if: always()
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          # FETCH_HEAD, not origin/$BASE_REF: the fetch above prints only
          # "-> FETCH_HEAD", and whether it also moves the remote-tracking ref
          # depends on the refspec actions/checkout left behind.
          BASE=$(git rev-parse --verify FETCH_HEAD)
          OLD_BLOB=$(git rev-parse --verify --quiet "${BASE}:scripts/coverage_relay_go.floor") || true
          if [ ! -f scripts/coverage_relay_go.floor ]; then
            if [ -n "$OLD_BLOB" ]; then
              echo "The floor exists on ${BASE_REF} (${BASE}) and is GONE on this head."
              echo "Deleting it makes --gate's bootstrap branch a permanent off switch."
              exit 1
            fi
            echo "no floor on either side; nothing to compare"
            echo "This is the census state: the floor-introducing PR before its own"
            echo "floor commit lands. Expected on EVERY run until it does, and never"
            echo "again afterwards -- once a floor is on the base ref, its absence"
            echo "here is the deletion the branch above refuses."
            exit 0
          fi
          if [ -z "$OLD_BLOB" ]; then
            echo "no floor on ${BASE_REF} (${BASE}); this head introduces one"
            echo "Expected exactly once, on the PR that introduces the floor."
            exit 0
          fi
          OLD=$(git cat-file blob "$OLD_BLOB" | grep -E '^missing=' | cut -d= -f2)
          NEW=$(grep -E '^missing=' scripts/coverage_relay_go.floor | cut -d= -f2)
          echo "floor: base=$OLD head=$NEW"
          if [ "$NEW" -gt "$OLD" ]; then
            echo "The floor was raised ($OLD -> $NEW): more missed statements are now permitted."
            echo "A floor may rise only in a PR that earns and explains the rise."
            exit 1
          fi

  # The one check in this workflow that may be required. It always reports,
  # because it is not gated on anything — see the comment on the triggers.
  go-result:
    name: Go result
    runs-on: ubuntu-latest
    needs: [changes, build, lint, coverage]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify the Go outcome
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
        run: |
          echo "changes=$CHANGES_RESULT build=$BUILD_RESULT lint=$LINT_RESULT coverage=$COVERAGE_RESULT go-required=$GO_REQUIRED"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection itself failed — cannot prove the Go jobs were unnecessary."
            exit 1
          fi
          if [ "$GO_REQUIRED" != "true" ]; then
            echo "No Go-relevant paths changed; the Go jobs were deliberately skipped."
            exit 0
          fi
          # `skipped` here means a gated job never ran on a run that needed
          # it, so only an exact `success` may report green.
          for pair in "build:$BUILD_RESULT" "lint:$LINT_RESULT" "coverage:$COVERAGE_RESULT"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "The Go jobs were required and ${pair%%:*} did not succeed."
              exit 1
            fi
          done
          echo "Go build, vet, tests, lint and the coverage gate passed."
