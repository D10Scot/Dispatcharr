name: Pages

# Builds one site.json from the metrics-data checkout plus the curated
# files on main, then assembles it with the static dashboard (dashboard/)
# into a site artifact and publishes it to GitHub Pages. metrics-data stays
# pure data; this workflow is the only place dashboard code and metrics
# history are combined.
#
# Deliberately does not use `workflow_run` to chain off the Metrics workflow:
# zizmor's dangerous-triggers audit flags workflow_run as fundamentally
# insecure (the run defaults to base-repo permissions regardless of what
# triggered it), and this repo keeps that audit at zero findings. A short
# schedule plus manual dispatch achieves the same "publish shortly after a
# metrics append" outcome without the trigger-confusion risk.

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'metrics/**'
      - 'scripts/run_metrics_tests.sh'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '15 6 * * *' # daily, shortly after Metrics' daily 06:00 UTC run
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege for the build half, narrowing the top-level default:
    # `contents: read` for the two checkouts, `pull-requests: read` for the
    # `--check-prs` validation below. Publishing needs more than either and
    # gets it on the deploy job alone.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: main
          # Milestone SHAs are validated as first-parent commits since the
          # v0.29.0 baseline; a shallow checkout leaves that history missing.
          fetch-depth: 0

      - name: Checkout metrics-data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: metrics-data
          path: metrics-data

      - name: Install the build step's one dependency (hash-pinned)
        # Into a venv, not the system interpreter - PEP 668 hazard on the
        # runner image (mirrors lint.yml's metrics-tests job).
        working-directory: main
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r metrics/requirements.txt

      - name: Validate curated files online and build site.json
        # --check-prs reads each curated PR's merged state from the API. The
        # job grants `pull-requests: read` for exactly that; GITHUB_TOKEN
        # carries no more. --ref stays at its default "auto" (R30: prefers
        # origin/main, else main); no --repo needed since working-directory
        # is already the main checkout.
        #
        # A push-triggered run can race the Metrics workflow: if this build
        # starts before HEAD's snapshot row has landed on metrics-data, the
        # site.json it produces shows that day's snapshot tiles as stale
        # until the next daily run picks it up. Accepted (R30) - the
        # schedule trigger self-heals a day later, and a push-triggered
        # rebuild only happens on dashboard/metrics code changes anyway.
        working-directory: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python -m metrics.build --validate-only --curated metrics/curated --check-prs
          .venv/bin/python -m metrics.build --data ../metrics-data --curated metrics/curated --out "$RUNNER_TEMP/site/site.json"

      - name: Assemble site
        id: assemble
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          cp -r main/dashboard/. "$site/"
          rm -rf "$site/tests"
          {
            echo "site_dir<<SITE_DIR_EOF"
            echo "$site"
            echo "SITE_DIR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.assemble.outputs.site_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
