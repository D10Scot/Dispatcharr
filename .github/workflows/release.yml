name: Create Release

# A release is two steps and this workflow commits nothing (ADR 0004):
#   1. A normal pull request bumps version.py and merges through the Main
#      ruleset like any other change.
#   2. This workflow is dispatched manually on main with that same version.
#      It verifies that every check the Main ruleset requires passed on the
#      head SHA, tags that SHA, builds, signs, attests and creates the
#      release. It never writes to a branch.
#
# The tag is created before the build, deliberately: the images are labelled
# and pushed against a tag that already exists. So a `docker` job that fails
# leaves the tag behind, and re-dispatching the same version needs that tag
# deleted by hand first — `verify` refuses an existing tag on purpose.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with no leading v (e.g. 0.30.0). Must already be __version__ in version.py on main.'
        required: true
        type: string

# Add explicit permissions for the workflow
permissions:
  contents: read

# No cancel-in-progress: this workflow pushes a tag, then builds/pushes images
# against that tag. Cancelling mid-run could leave a pushed tag with no
# matching image. Serialize instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # The whole trust model of a release lives in this job. Nothing here
    # re-runs a suite: it proves the migration gate already passed on the
    # exact commit about to be tagged, and refuses otherwise.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ inputs.version }}
      sha: ${{ github.sha }}
      repo_owner: ${{ steps.meta.outputs.repo_owner }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      base_image: ${{ steps.base.outputs.image }}
    permissions:
      contents: read
      checks: read # list check runs for the head SHA
    steps:
      - name: Refuse a dispatch from anything but main
        # Deliberately a failing step and not a job-level `if:`: a skipped job
        # reports success, and "the release quietly did nothing" is exactly
        # the outcome this gate exists to prevent.
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::a release can only be dispatched on main; this run is on ${REF}"
            exit 1
          fi
          echo "ref is ${REF}"

      # Pinned to github.sha rather than the moving `main` tip: this is the
      # commit whose checks are verified below, the commit the tag job tags,
      # and the commit every build checks out. Reading version.py from `main`
      # instead would read a different tree if main advanced mid-run.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Check version.py matches the requested version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version input \"${INPUT_VERSION}\" is not MAJOR.MINOR.PATCH with no leading v"
            exit 1
          fi
          FILE_VERSION=$(python3 -c 'import version; print(version.__version__)')
          if [ "${FILE_VERSION}" != "${INPUT_VERSION}" ]; then
            echo "::error::version.py at ${SHA} is ${FILE_VERSION}, but this dispatch asked for ${INPUT_VERSION}; merge a version bump pull request first"
            exit 1
          fi
          echo "version.py is ${FILE_VERSION}"

      - name: Check the tag does not already exist
        # Three outcomes, not two. `git ls-remote … | grep -q .` collapsed a
        # network or authentication failure into "the tag is free" — an `if`
        # condition is exempt from `set -e`, and pipefail only turns git's
        # non-zero exit into a false condition. Here 200 means the tag exists,
        # 404 means it is free, and anything else is a failed lookup that
        # stops the release rather than being read as absence.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          LOOKUP="${RUNNER_TEMP}/tag-lookup.txt"
          RC=0
          gh api "repos/${REPOSITORY}/git/ref/tags/v${INPUT_VERSION}" > "${LOOKUP}" 2>&1 || RC=$?
          if [ "${RC}" -eq 0 ]; then
            echo "::error::tag v${INPUT_VERSION} already exists on origin; a release is never re-cut over an existing tag"
            exit 1
          fi
          if ! grep -q "HTTP 404" "${LOOKUP}"; then
            echo "::error::could not determine whether tag v${INPUT_VERSION} exists; the lookup itself failed, so absence cannot be assumed"
            cat "${LOOKUP}"
            exit 1
          fi
          echo "tag v${INPUT_VERSION} is free"

      - name: Read the required checks from the Main ruleset
        # Read at run time, never hard-coded: the release and the merge gate
        # must be the same list seen from two sides. Adding a required check
        # to the ruleset tightens the release with no edit here.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTEXTS="${RUNNER_TEMP}/required-contexts.txt"
          gh api "repos/${REPOSITORY}/rulesets/21229979" \
            --jq '.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context' \
            > "${CONTEXTS}"
          if [ ! -s "${CONTEXTS}" ]; then
            echo "::error::the Main ruleset (21229979) lists no required status checks; refusing to release against an empty gate"
            exit 1
          fi
          echo "required checks:"
          cat "${CONTEXTS}"

      - name: Require every ruleset check to have succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONTEXTS="${RUNNER_TEMP}/required-contexts.txt"
          RUNS="${RUNNER_TEMP}/check-runs.jsonl"

          # A push to main produces these check runs under the push workflows;
          # the aggregate job names ("E2E result" and friends) are the
          # check-run names the ruleset lists as contexts.
          gh api "repos/${REPOSITORY}/commits/${SHA}/check-runs?per_page=100" --paginate \
            --jq '.check_runs[] | {name: .name, conclusion: .conclusion, started_at: .started_at, id: .id}' \
            > "${RUNS}"

          FAILED=0
          while IFS= read -r CONTEXT; do
            [ -n "${CONTEXT}" ] || continue
            # Most recent run wins: re-running a failed aggregate is what makes
            # a commit releasable, so only the latest attempt counts. Ordered
            # by id alone, never by started_at: a queued run has a null
            # started_at, which sorts first and would let an older success
            # mask a re-run that has not started yet. Check-run ids are
            # monotonic per repository, so the newest attempt has the highest.
            STATE=$(jq -rs --arg name "${CONTEXT}" '
              [ .[] | select(.name == $name) ]
              | sort_by(.id)
              | last
              | if . == null then "absent" else (.conclusion // "still running") end
            ' "${RUNS}")
            if [ "${STATE}" = "success" ]; then
              echo "ok       ${CONTEXT}"
            elif [ "${STATE}" = "absent" ]; then
              echo "::error::required check \"${CONTEXT}\" is absent on ${SHA}, expected success — no run of the workflow that produces it reached this commit"
              FAILED=1
            else
              echo "::error::required check \"${CONTEXT}\" is ${STATE} on ${SHA}, expected success"
              FAILED=1
            fi
          done < "${CONTEXTS}"

          if [ "${FAILED}" -ne 0 ]; then
            echo "::error::the Main ruleset gate did not pass on ${SHA}; nothing is tagged or built"
            exit 1
          fi
          echo "every required check succeeded on ${SHA}"

      - name: Set up Docker Buildx
        # Needed for "Resolve base image digest" below (docker buildx
        # imagetools inspect) — this job otherwise never touches Docker.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set repository metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO_OWNER=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

          REPO_NAME=$(echo "${REPOSITORY}" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Generate timestamp for build
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Resolve base image digest
        # Resolved exactly once, here in `verify`, not inside the matrix
        # job below: the matrix runs amd64 and arm64 as separate jobs on
        # separate runners that can start minutes apart, so resolving
        # per-leg (the previous version of this step) could let ":base"
        # move between them and hand each arch a different base. Every
        # matrix leg now reads the same needs.verify.outputs.base_image.
        id: base
        env:
          REPO_OWNER: ${{ steps.meta.outputs.repo_owner }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${REPO_NAME}:base" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=ghcr.io/${REPO_OWNER}/${REPO_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

  tag:
    # The only job in this workflow that writes to the repository, and it
    # writes exactly one ref. There is deliberately no checkout here: the tag
    # is created through the API, so no job in this workflow ever holds a git
    # credential on disk and the file needs no persist-credentials exception.
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          TAG_SHA=$(gh api "repos/${REPOSITORY}/git/tags" \
            --method POST \
            -f "tag=v${VERSION}" \
            -f "message=Release v${VERSION}" \
            -f "object=${SHA}" \
            -f "type=commit" \
            --jq '.sha')
          gh api "repos/${REPOSITORY}/git/refs" \
            --method POST \
            -f "ref=refs/tags/v${VERSION}" \
            -f "sha=${TAG_SHA}" \
            --jq '.ref'
          echo "tagged ${SHA} as v${VERSION}"

  docker:
    # Needs `tag` as well as `verify` so a failure to tag never leaves
    # published :latest and :<version> images with no tag or release behind
    # them — the same ordering the old tag-then-build job had.
    needs: [verify, tag]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.verify.outputs.sha }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ needs.verify.outputs.repo_owner }}/${{ needs.verify.outputs.repo_name }}
          labels: |
            org.opencontainers.image.title=${{ needs.verify.outputs.repo_name }}
            org.opencontainers.image.description=Your ultimate IPTV & stream Management companion.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.created=${{ needs.verify.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=See repository
            org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/
            org.opencontainers.image.vendor=${{ needs.verify.outputs.repo_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            maintainer=${{ github.actor }}
            build_version=Dispatcharr version: ${{ needs.verify.outputs.version }} Build date: ${{ needs.verify.outputs.timestamp }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: |
            ghcr.io/${{ needs.verify.outputs.repo_owner }}/${{ needs.verify.outputs.repo_name }}:latest-${{ matrix.platform }}
            ghcr.io/${{ needs.verify.outputs.repo_owner }}/${{ needs.verify.outputs.repo_name }}:${{ needs.verify.outputs.version }}-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.verify.outputs.base_image }}
            BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
          file: ./docker/Dockerfile

  create-manifest:
    needs: [verify, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest tags
        env:
          PREP_REPO_OWNER: ${{ needs.verify.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.verify.outputs.repo_name }}
          PREP_NEW_VERSION: ${{ needs.verify.outputs.version }}
          PREP_TIMESTAMP: ${{ needs.verify.outputs.timestamp }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OWNER=${PREP_REPO_OWNER}
          REPO=${PREP_REPO_NAME}
          VERSION=${PREP_NEW_VERSION}
          TIMESTAMP=${PREP_TIMESTAMP}

          echo "Creating multi-arch manifest for ${OWNER}/${REPO}"

          # GitHub Container Registry manifests
          # Create one manifest with both latest and version tags
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PREP_REPO_NAME}" \
            --annotation "index:org.opencontainers.image.description=Your ultimate IPTV & stream Management companion." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.licenses=See repository" \
            --annotation "index:org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/" \
            --annotation "index:org.opencontainers.image.vendor=${OWNER}" \
            --annotation "index:org.opencontainers.image.authors=${ACTOR}" \
            --annotation "index:maintainer=${ACTOR}" \
            --annotation "index:build_version=Dispatcharr version: ${VERSION} Build date: ${TIMESTAMP}" \
            --tag ghcr.io/${OWNER}/${REPO}:latest \
            --tag ghcr.io/${OWNER}/${REPO}:${VERSION} \
            ghcr.io/${OWNER}/${REPO}:${VERSION}-amd64 ghcr.io/${OWNER}/${REPO}:${VERSION}-arm64

  sign-and-attest:
    # Deliberately its own job — the only one in this workflow with
    # id-token/attestations write, so auditing "what can sign a release"
    # means reading this one job, not cross-referencing several.
    needs: [verify, create-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the signature/attestation alongside the image
      id-token: write # mint the OIDC token cosign and the attest actions use
      attestations: write
      artifact-metadata: write # required by actions/attest for the artifact storage record
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolved
        env:
          PREP_REPO_OWNER: ${{ needs.verify.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.verify.outputs.repo_name }}
          PREP_NEW_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${PREP_REPO_OWNER}/${PREP_REPO_NAME}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${PREP_NEW_VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: |
          # anchore/syft v1.51.0
          docker run --rm -v "$PWD:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favor of actions/attest (same
        # inputs) — confirmed via a real run of this exact job before this
        # rename, which also surfaced the deprecation warning below.
        #
        # create-storage-record: false — verified via a real run that the
        # default (true) fails here with "no artifacts found": the storage
        # record feature expects a GitHub Actions build artifact (uploaded
        # via actions/upload-artifact) to correlate with, which a pure
        # container-image subject never has. The attest-build-provenance
        # step below hits the same subject and succeeds at it, so this is
        # specific to SBOM-mode subject resolution, not a permissions gap —
        # the SBOM attestation itself still pushes to the registry fine
        # either way, this only turns off the (currently broken) sidebar
        # summary indexing.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          push-to-registry: true

  create-release:
    needs: [verify, tag, create-manifest, sign-and-attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Was softprops/action-gh-release. The usage was a plain "create a release
      # from an existing tag" with no assets and no body, which gh does natively
      # (draft and prerelease both default to false), so this drops a
      # third-party action from the release path. The tag already exists: the
      # tag job creates it before this job runs.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --title "Release v${VERSION}" \
            --notes ""
