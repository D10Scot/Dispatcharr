name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type of version increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

# Add explicit permissions for the workflow
permissions:
  contents: read

# No cancel-in-progress: this workflow commits a version bump, pushes a tag,
# then builds/pushes images against that tag. Cancelling mid-run could leave
# a pushed tag with no matching image. Serialize instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.update_version.outputs.new_version }}
      repo_owner: ${{ steps.meta.outputs.repo_owner }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      base_image: ${{ steps.base.outputs.image }}
    permissions:
      contents: write
    steps:
      # persist-credentials stays on here alone: this job commits the version
      # bump and pushes it with tags (see "Commit and tag" below), so it needs
      # the credential the other ten checkouts in this repo drop. It uploads no
      # artifacts, which is the leak artipacked actually guards against.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # Needed for "Resolve base image digest" below (docker buildx
        # imagetools inspect) — this job otherwise never touches Docker.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Update Version
        id: update_version
        env:
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          python scripts/bump_version.py "${INPUT_VERSION_TYPE}"
          NEW_VERSION=$(python -c "import version; print(f'{version.__version__}')")
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Update Changelog
        env:
          UPDATED_VERSION: ${{ steps.update_version.outputs.new_version }}
        run: |
          python scripts/update_changelog.py "${UPDATED_VERSION}"

      - name: Set repository metadata
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO_OWNER=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

          REPO_NAME=$(echo "${REPOSITORY}" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Generate timestamp for build
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Resolve base image digest
        # Resolved exactly once, here in `prepare`, not inside the matrix
        # job below: the matrix runs amd64 and arm64 as separate jobs on
        # separate runners that can start minutes apart, so resolving
        # per-leg (the previous version of this step) could let ":base"
        # move between them and hand each arch a different base. Every
        # matrix leg now reads the same needs.prepare.outputs.base_image.
        id: base
        env:
          REPO_OWNER: ${{ steps.meta.outputs.repo_owner }}
          REPO_NAME: ${{ steps.meta.outputs.repo_name }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${REPO_NAME}:base" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=ghcr.io/${REPO_OWNER}/${REPO_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Commit and Tag
        env:
          UPDATED_VERSION: ${{ steps.update_version.outputs.new_version }}
        run: |
          git add version.py CHANGELOG.md
          git commit -m "Release v${UPDATED_VERSION}"
          git tag -a "v${UPDATED_VERSION}" -m "Release v${UPDATED_VERSION}"
          git push origin main --tags

  docker:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.repo_name }}
            org.opencontainers.image.description=Your ultimate IPTV & stream Management companion.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.new_version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=See repository
            org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/
            org.opencontainers.image.vendor=${{ needs.prepare.outputs.repo_owner }}
            org.opencontainers.image.authors=${{ github.actor }}
            maintainer=${{ github.actor }}
            build_version=Dispatcharr version: ${{ needs.prepare.outputs.new_version }} Build date: ${{ needs.prepare.outputs.timestamp }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.platform }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:latest-${{ matrix.platform }}
            ghcr.io/${{ needs.prepare.outputs.repo_owner }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.new_version }}-${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            BRANCH=${{ github.ref_name }}
            REPO_URL=https://github.com/${{ github.repository }}
          file: ./docker/Dockerfile

  create-manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest tags
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          PREP_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OWNER=${PREP_REPO_OWNER}
          REPO=${PREP_REPO_NAME}
          VERSION=${PREP_NEW_VERSION}
          TIMESTAMP=${PREP_TIMESTAMP}

          echo "Creating multi-arch manifest for ${OWNER}/${REPO}"

          # GitHub Container Registry manifests
          # Create one manifest with both latest and version tags
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=${PREP_REPO_NAME}" \
            --annotation "index:org.opencontainers.image.description=Your ultimate IPTV & stream Management companion." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.created=${TIMESTAMP}" \
            --annotation "index:org.opencontainers.image.revision=${COMMIT_SHA}" \
            --annotation "index:org.opencontainers.image.licenses=See repository" \
            --annotation "index:org.opencontainers.image.documentation=https://dispatcharr.github.io/Dispatcharr-Docs/" \
            --annotation "index:org.opencontainers.image.vendor=${OWNER}" \
            --annotation "index:org.opencontainers.image.authors=${ACTOR}" \
            --annotation "index:maintainer=${ACTOR}" \
            --annotation "index:build_version=Dispatcharr version: ${VERSION} Build date: ${TIMESTAMP}" \
            --tag ghcr.io/${OWNER}/${REPO}:latest \
            --tag ghcr.io/${OWNER}/${REPO}:${VERSION} \
            ghcr.io/${OWNER}/${REPO}:${VERSION}-amd64 ghcr.io/${OWNER}/${REPO}:${VERSION}-arm64

  sign-and-attest:
    # Deliberately its own job — the only one in this workflow with
    # id-token/attestations write, so auditing "what can sign a release"
    # means reading this one job, not cross-referencing several.
    needs: [prepare, create-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the signature/attestation alongside the image
      id-token: write # mint the OIDC token cosign and the attest actions use
      attestations: write
      artifact-metadata: write # required by actions/attest for the artifact storage record
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolved
        env:
          PREP_REPO_OWNER: ${{ needs.prepare.outputs.repo_owner }}
          PREP_REPO_NAME: ${{ needs.prepare.outputs.repo_name }}
          PREP_NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${PREP_REPO_OWNER}/${PREP_REPO_NAME}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${PREP_NEW_VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: |
          # anchore/syft v1.51.0
          docker run --rm -v "$PWD:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favor of actions/attest (same
        # inputs) — confirmed via a real run of this exact job before this
        # rename, which also surfaced the deprecation warning below.
        #
        # create-storage-record: false — verified via a real run that the
        # default (true) fails here with "no artifacts found": the storage
        # record feature expects a GitHub Actions build artifact (uploaded
        # via actions/upload-artifact) to correlate with, which a pure
        # container-image subject never has. The attest-build-provenance
        # step below hits the same subject and succeeds at it, so this is
        # specific to SBOM-mode subject resolution, not a permissions gap —
        # the SBOM attestation itself still pushes to the registry fine
        # either way, this only turns off the (currently broken) sidebar
        # summary indexing.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          push-to-registry: true

  create-release:
    needs: [prepare, create-manifest, sign-and-attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Was softprops/action-gh-release. The usage was a plain "create a release
      # from an existing tag" with no assets and no body, which gh does natively
      # (draft and prerelease both default to false), so this drops a
      # third-party action from the release path. The tag already exists: the
      # prepare job pushes it before this job runs.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --title "Release v${VERSION}" \
            --notes ""
