name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag and branch
        id: set-tag-branch
        env:
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF_NAME_FULL" == "refs/heads/main" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
            echo "BRANCH=main" >> $GITHUB_ENV
          fi

      - name: Convert repository name to lowercase
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "REPO_NAME=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_OWNER=$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_NAME_ONLY=$(echo "$REPOSITORY" | cut -d '/' -f 2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Resolve base image digest
        # Pins the base for this build to whatever ":base" currently resolves
        # to, once, so the amd64 and arm64 legs of this single buildx
        # invocation build against the identical base layer.
        id: base
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/${REPO_OWNER}/${REPO_NAME_ONLY}:base" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=ghcr.io/${REPO_OWNER}/${REPO_NAME_ONLY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            BRANCH=${{ env.BRANCH }}
            REPO_URL=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ env.REPO_NAME }}:${{ env.TAG }}
            ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}

  sign-and-attest:
    # Deliberately its own job — the only one in this workflow with
    # id-token/attestations write, so auditing "what can sign a release"
    # means reading this one job, not cross-referencing several.
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the signature/attestation alongside the image
      id-token: write # mint the OIDC token cosign and the attest actions use
      attestations: write
      artifact-metadata: write # required by actions/attest for the artifact storage record
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published digest
        id: resolved
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_NAME}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        env:
          IMAGE: ${{ steps.resolved.outputs.image }}
          DIGEST: ${{ steps.resolved.outputs.digest }}
        run: |
          docker run --rm -v "$PWD:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "${IMAGE}@${DIGEST}" -o spdx-json > sbom.spdx.json

      - name: Attest SBOM
        # actions/attest-sbom is deprecated in favor of actions/attest (same
        # inputs) — confirmed via a real run of this exact job before this
        # rename, which also surfaced the deprecation warning below.
        #
        # create-storage-record: false — verified via a real run that the
        # default (true) fails here with "no artifacts found": the storage
        # record feature expects a GitHub Actions build artifact (uploaded
        # via actions/upload-artifact) to correlate with, which a pure
        # container-image subject never has. The attest-build-provenance
        # step below hits the same subject and succeeds at it, so this is
        # specific to SBOM-mode subject resolution, not a permissions gap —
        # the SBOM attestation itself still pushes to the registry fine
        # either way, this only turns off the (currently broken) sidebar
        # summary indexing.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.resolved.outputs.image }}
          subject-digest: ${{ steps.resolved.outputs.digest }}
          push-to-registry: true
